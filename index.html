<!DOCTYPE html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opintokeskus · 2 viikon näkymä</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#25364c;background:#f8fafc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:920px;margin:0 auto;padding:18px}.hero{background:linear-gradient(120deg,#e5f1ff,#f4eafa);border:1px solid #d9e5f5;border-radius:20px;padding:22px 24px}.eyebrow{text-transform:uppercase;letter-spacing:1.6px;color:#506c94;font-size:11px;font-weight:800;margin:0 0 7px}.hero h1{font-size:clamp(24px,4vw,32px);line-height:1.15;margin:0 0 8px;letter-spacing:-.6px}.hero p{font-size:14px;margin:0;color:#52637d}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar .dates{font-weight:800;font-size:17px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #d6e1ee;border-radius:10px;background:#fff;color:#345373;padding:9px 12px;font-size:13px;font-weight:700}.btn.primary{background:#365f9b;color:#fff;border-color:#365f9b}.btn:hover{filter:brightness(.98)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.stat{border:1px solid #e3e9f2;border-radius:14px;background:white;padding:12px 15px}.stat strong{font-size:25px;display:block}.stat span{font-size:12px;color:#6d7d94}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:15px 0}.chip{background:#fff;border:1px solid #dce5ee;color:#52647a;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700}.chip.active{background:#325a92;color:white;border-color:#325a92}.toggle{font-size:12px;margin-left:auto;color:#4c607a;display:flex;gap:7px;align-items:center}.days{display:flex;flex-direction:column;gap:12px}.day{background:white;border:1px solid #e1e8f1;border-radius:15px;overflow:hidden}.dayhead{display:flex;align-items:center;gap:10px;background:#eaf4ff;padding:10px 14px;border-bottom:1px solid #dae9f8}.dayhead strong{font-size:13px}.dayhead small{color:#6a829b;font-size:12px}.item{display:flex;align-items:flex-start;gap:10px;margin:9px;border-radius:12px;padding:11px 12px;border:1px solid transparent}.item.task{background:#fff4e5;border-color:#f5e4ca}.item.lesson{background:#edf3ff;border-color:#dce7fb}.item.end{background:#f1eaff;border-color:#e8d9f7}.item.done{background:#e8f5e9;border-color:#cfe9d5}.check{border:2px solid #b1a087;width:21px;height:21px;min-width:21px;border-radius:7px;background:#fff;color:#247449;font-size:15px;line-height:16px;padding:0;margin-top:2px;font-weight:900}.check.checked{background:#d9f0df;border-color:#8fc5a2}.symbol{width:23px;height:23px;min-width:23px;display:flex;align-items:center;justify-content:center;color:#5570a9;font-size:18px}.itembody{flex:1;min-width:0}.itemtitle{font-size:14px;font-weight:750;line-height:1.4}.item.done .itemtitle{text-decoration:line-through;text-decoration-color:#84ad8b;color:#3a684c}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}.meta span{font-size:11px;color:#6b7180}.pill{border-radius:6px;padding:3px 6px;background:#ffffffb8!important;color:#566072!important;font-weight:650}.note{font-size:12px;color:#687182;margin-top:6px;line-height:1.45}.note a{color:#265a98;text-decoration:underline}.remove{background:transparent;border:0;font-size:19px;color:#9aa4b4;align-self:flex-start}.muted{color:#6e7c8e}.blank{background:white;border:1px dashed #cfdae8;border-radius:14px;padding:28px 18px;text-align:center;color:#718098}.sectionHead{margin:20px 0 10px;font-size:16px;font-weight:850}.unscheduled{margin-top:19px;background:#fff;border:1px solid #e3e9f2;border-radius:14px;padding:14px}.unscheduled summary{cursor:pointer;font-weight:800;color:#486282}.unscheduled .item{margin:9px 0}.addpanel{display:none;background:white;border:1px solid #d9e5f1;border-radius:15px;padding:15px;margin:15px 0}.addpanel.show{display:block}.addgrid{display:grid;grid-template-columns:2fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:#4c6480}.field input,.field select{border:1px solid #d7e1ee;border-radius:9px;padding:9px;width:100%;background:white;color:#2d435b}.submitrow{display:flex;justify-content:flex-end;margin-top:10px}.foot{font-size:12px;line-height:1.5;color:#77849a;margin-top:18px}.tinyLink{color:#345f99;font-size:12px;font-weight:700}.header-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}@media(max-width:620px){.app{padding:10px}.hero{padding:20px}.toolbar .dates{width:100%}.stats{gap:6px}.stat{padding:9px}.stat strong{font-size:22px}.addgrid{grid-template-columns:1fr}.toggle{margin-left:0}.actions{width:100%}}

/* Viikkonäkymä */
.viewbar{display:flex;gap:6px;align-items:center;margin:18px 0 2px}
.viewbtn{padding:9px 15px;border:1px solid #d1dfea;border-radius:10px;background:#fff;color:#446078;font-weight:800;font-size:13px}
.viewbtn.active{background:#325a92;color:#fff;border-color:#325a92}
.weekgroup{margin:12px 0 18px}
.weektitle{font-size:13px;color:#506882;font-weight:800;margin:0 0 8px}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.weekday{border:1px solid #dfe7f0;background:#fff;border-radius:12px;min-width:0;min-height:116px;text-align:left;padding:9px 7px;color:#294461;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.weekday:hover{border-color:#8facd0;background:#f9fcff}

.weekday.todaymark .daynum{border-radius:50%;background:#2d609d;color:#fff;align-self:flex-start;padding:1px 6px}
.weekday.weekend{background:#f8fafc}
.weekday.weekend.selected{background:#eaf4ff}
.weekday .daylabel{font-size:11px;color:#607994;font-weight:700}
.weekday .daynum{font-size:19px;font-weight:800;line-height:1.5}

@media(max-width:620px){.weekgrid{gap:3px}.weekday{min-height:79px;padding:6px 2px;border-radius:8px;align-items:center;text-align:center}.weekday.selected{padding:5px 1px}.weekday .daylabel{font-size:10px}.weekday .daynum{font-size:16px}.weekday .daybadges{justify-content:center}.daybadge{font-size:10px;padding:1px 3px}.daypreview{display:none}.daydetails{padding:9px}.viewbtn{flex:1}}
</style></head><body><div class="app" id="app"></div><script>
(function(){
'use strict';
const START=[];
const KEY='opintokeskus_pysyva_v2';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let records=Array.isArray(saved.records)?saved.records:START;
let cloudStatus='Haetaan ajantasaisia tietoja GitHubista…';
let lastCloudSync='';
let offset=0,filter='all',showDone=true,formOpen=false,view='week',selectedDate='';
const host=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify({records}))}catch(e){}}
async function syncFromCloud(){
  try{
    const res=await fetch('./data.json?v='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!Array.isArray(data.records)||data.records.length>1000)throw new Error('Virheellinen tietomuoto');
    const old=new Map(records.map(x=>[String(x.id),x]));
    const ids=new Set();
    const next=data.records.map((entry,i)=>{
      if(!entry||typeof entry.title!=='string'||!entry.id)throw new Error('Virheellinen merkintä');
      const x={...entry,id:String(entry.id),done:!!entry.done,custom:false};
      ids.add(x.id);
      const previous=old.get(x.id);
      if(previous&&previous._local===true&&previous._originDone===x.done){
        x.done=!!previous.done;
        x._local=true;
        x._originDone=previous._originDone;
      }
      return x;
    });
    const extras=records.filter(x=>x.custom&&!ids.has(x.id));
    records=[...next,...extras];
    cloudStatus='Ajantasaiset tiedot GitHubista';
    lastCloudSync=new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'});
    save();render();
  }catch(err){
    cloudStatus='Yhteys ei onnistunut – näytetään selaimeen tallennetut tiedot';
    render();
  }
}
function dateObj(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dateStr(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayAdd(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function formatDate(d){return new Intl.DateTimeFormat('fi-FI',{day:'numeric',month:'numeric',year:'numeric'}).format(d)}
function dateHead(d){return new Intl.DateTimeFormat('fi-FI',{weekday:'long',day:'numeric',month:'long'}).format(d)}
function enc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sort(a,b){return (a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99')||a.title.localeCompare(b.title,'fi')}
function item(e){const klass=e.done?'done':e.kind;const kind=e.kind==='task'?'Tehtävä':e.kind==='lesson'?'Opetus / tapahtuma':'Kurssi päättyy';const btn=e.kind==='task'?`<button class="check ${e.done?'checked':''}" data-check="${enc(e.id)}" aria-label="Merkitse ${e.done?'tekemättömäksi':'tehdyksi'}">${e.done?'✓':''}</button>`:`<span class="symbol">${e.kind==='lesson'?'▣':'◈'}</span>`;const link=e.url?` <a href="${enc(e.url)}" target="_blank" rel="noopener noreferrer">Avaa ohje</a>`:'';return `<article class="item ${klass}">${btn}<div class="itembody"><div class="itemtitle">${enc(e.title)}</div><div class="meta"><span class="pill">${enc(e.course)}</span><span class="pill">${kind}</span>${e.time?`<span class="pill">klo ${enc(e.time)}</span>`:''}${e.done?'<span class="pill">✓ Tehty</span>':''}</div>${e.note||link?`<div class="note">${enc(e.note)}${link}</div>`:''}</div>${e.custom?`<button class="remove" data-delete="${enc(e.id)}" title="Poista oma merkintä">×</button>`:''}</article>`}

function renderList(visible,groups,today){
 if(!visible.length)return '<div class="blank">Ei tapahtumia tällä aikavälillä valituilla suodattimilla.</div>';
 return Object.keys(groups).map(ds=>{
   const d=dateObj(ds),delta=Math.round((d-today)/86400000);
   const extra=delta===0?'Tänään':delta===1?'Huomenna':'';
   return `<section class="day"><div class="dayhead"><strong>${dateHead(d)}</strong>${extra?`<small>· ${extra}</small>`:''}</div>${groups[ds].map(item).join('')}</section>`;
 }).join('');
}
function renderWeeks(begin,groups,today){
 const todayStr=dateStr(today);
 const startStr=dateStr(begin);
 const endStr=dateStr(dayAdd(begin,14));
 if(!selectedDate||selectedDate<startStr||selectedDate>=endStr){
   selectedDate=todayStr>=startStr&&todayStr<endStr?todayStr:startStr;
 }
 const weekRows=[0,7].map(dayOffset=>{
   const start=dayAdd(begin,dayOffset);
   const finish=dayAdd(start,6);
   const cells=Array.from({length:7},(_,i)=>{
     const d=dayAdd(start,i);
     const key=dateStr(d),entries=groups[key]||[];
     const pending=entries.filter(x=>x.kind==='task'&&!x.done).length;
     const completed=entries.filter(x=>x.kind==='task'&&x.done).length;
     const classes=entries.filter(x=>x.kind==='lesson').length;
     const ends=entries.filter(x=>x.kind==='end').length;
     const dayName=['Su','Ma','Ti','Ke','To','Pe','La'][d.getDay()];
     const previews=entries.slice(0,2).map(x=>`<span class="daypreview">${enc(x.title)}</span>`).join('');
     return `<button type="button" class="weekday ${key===selectedDate?'selected':''} ${key===todayStr?'todaymark':''} ${i>4?'weekend':''}" data-day="${key}" aria-label="${enc(dateHead(d))}, ${entries.length} merkintää" aria-pressed="${key===selectedDate?'true':'false'}">
       <span class="daylabel">${dayName}</span><span class="daynum">${d.getDate()}</span>
       <span class="daybadges">${pending?`<span class="daybadge">${pending}</span>`:''}${completed?`<span class="daybadge done">✓${completed}</span>`:''}${classes?`<span class="daybadge lesson">◉${classes}</span>`:''}${ends?`<span class="daybadge end">◈${ends}</span>`:''}</span>
       ${previews}
     </button>`;
   }).join('');
   return `<section class="weekgroup"><div class="weektitle">${formatDate(start)} – ${formatDate(finish)}</div><div class="weekgrid">${cells}</div></section>`;
 }).join('');
 const chosen=groups[selectedDate]||[];
 const detail=`<section class="daydetails"><header>${dateHead(dateObj(selectedDate))}</header>${chosen.length?chosen.map(item).join(''):'<div class="blank">Ei tapahtumia valittuna päivänä.</div>'}</section>`;
 const upcoming=records.filter(e=>e.kind==='task'&&!e.done&&e.date&&e.date>=todayStr).sort(sort).slice(0,3);
 const future=`<div class="nextthree"><strong>Kolme seuraavaa avointa tehtävää</strong>${upcoming.length?upcoming.map(x=>`<div class="nextline">◯ ${formatDate(dateObj(x.date))} · ${enc(x.title)} <span class="muted">(${enc(x.course)})</span></div>`).join(''):'<div class="nextline">Ei päivättyjä avoimia tehtäviä.</div>'}</div>`;
 return future+weekRows+detail;
}

function render(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),begin=dayAdd(dayAdd(today,-((today.getDay()+6)%7)),offset*14),finish=dayAdd(begin,14);const visible=records.filter(e=>e.date&&e.date>=dateStr(begin)&&e.date<dateStr(finish)&&(showDone||!e.done)&&(filter==='all'||e.kind===filter)).sort(sort);const active=visible.filter(e=>e.kind==='task'&&!e.done).length;const done=visible.filter(e=>e.kind==='task'&&e.done).length;const events=visible.filter(e=>e.kind!=='task').length;const groups={};visible.forEach(e=>(groups[e.date]??=[]).push(e));const undated=records.filter(e=>!e.date&&(showDone||!e.done)&&(filter==='all'||e.kind===filter)).sort(sort);
host.innerHTML=`<header class="hero"><p class="eyebrow">Yhteisöpedagogi · opintojen hallinta</p><h1>Opintokeskus</h1><p>Seuraavan kahden viikon tehtävät, etäopetukset ja kurssien päättymiset yhdessä näkymässä.</p><div class="header-actions"><button class="btn primary" id="addBtn">+ Lisää tehtävä</button><button class="btn" id="importBtn">Tuo varmuuskopio</button><button class="btn" id="exportBtn">Vie varmuuskopio</button><input type="file" id="importFile" accept=".json,application/json" style="display:none"></div><p class="syncState" style="font-size:12px;margin-top:10px">${enc(cloudStatus)}${lastCloudSync?' · päivitetty klo '+enc(lastCloudSync):''}</p></header>
<div class="addpanel ${formOpen?'show':''}" id="addPanel"><form id="newForm"><div class="addgrid"><div class="field"><label for="newTitle">Tehtävän nimi</label><input id="newTitle" name="title" required placeholder="Esim. palautettava essee"></div><div class="field"><label for="newDate">Päivämäärä</label><input id="newDate" name="date" type="date"></div><div class="field"><label for="newCourse">Kurssi</label><input id="newCourse" name="course" placeholder="Valinnainen"></div><div class="field"><label for="newKind">Tyyppi</label><select id="newKind" name="kind"><option value="task">Tehtävä</option><option value="lesson">Opetus / tapahtuma</option><option value="end">Kurssin päättyminen</option></select></div></div><div class="submitrow"><button class="btn primary" type="submit">Tallenna merkintä</button></div></form></div>
<div class="viewbar"><button class="viewbtn ${view==='week'?'active':''}" data-view="week">Viikko</button><button class="viewbtn ${view==='list'?'active':''}" data-view="list">Lista</button></div>
<div class="toolbar"><div><div class="dates">${formatDate(begin)} – ${formatDate(finish)}</div><div class="muted" style="font-size:12px;margin-top:3px">Kaksi kalenteriviikkoa (ma–su)</div></div><div class="actions"><button class="btn" id="prev">← Edelliset</button><button class="btn" id="today">Tänään</button><button class="btn" id="next">Seuraavat →</button></div></div>
<div class="stats"><div class="stat"><strong>${active}</strong><span>Avoinna olevia tehtäviä</span></div><div class="stat"><strong>${events}</strong><span>Opetus- ja kurssitapahtumia</span></div><div class="stat"><strong>${done}</strong><span>Tehdyksi merkittyjä</span></div></div>
<div class="controls">${[['all','Kaikki'],['task','Tehtävät'],['lesson','Opetukset'],['end','Päättymiset']].map(([v,label])=>`<button class="chip ${filter===v?'active':''}" data-filter="${v}">${label}</button>`).join('')}<label class="toggle"><input type="checkbox" id="showDone" ${showDone?'checked':''}> Näytä tehdyt</label></div>
<main class="days">${view==='week'?renderWeeks(begin,groups,today):renderList(visible,groups,today)}</main>
<details class="unscheduled"><summary>Päiväämättömät tehtävät (${undated.length})</summary>${undated.length?undated.map(item).join(''):'<p class="muted">Ei avoimia päiväämättömiä merkintöjä.</p>'}</details><p class="foot">Kurssien päättymispäivät eivät välttämättä ole tehtävien viimeisiä palautuspäiviä. Kielenhuollon tehtäväpäivät perustuvat aikaisempaan työskentelyaikatauluun. OAMKin heinäkuun 2027 loppupäivä on alustava. Ei muistutusilmoituksia eikä automaattista Google Kalenteri -synkronointia. Laitteella tekemäsi tehtäväkuittaukset tallentuvat kyseisen selaimen paikalliseen muistiin. Ne eivät vielä synkronoidu puhelimen ja tietokoneen välillä. Vie varmuuskopio ennen selaimen tietojen tyhjentämistä tai laitteenvaihtoa. Tämän julkisen sovelluksen yhteinen tehtävälista haetaan GitHubista. Sen tiedot ovat julkisesti luettavissa. Selaimessa tehtävät omat muutokset säilyvät tässä laitteessa, eivätkä siirry automaattisesti GitHubiin.</p>`;
host.querySelector('#importBtn').onclick=()=>host.querySelector('#importFile').click();
host.querySelector('#importFile').onchange=async(ev)=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;if(file.size>2000000){alert('Tiedosto on liian suuri (enintään 2 Mt).');return;}try{const input=JSON.parse(await file.text());const rr=Array.isArray(input)?input:input.records;if(!Array.isArray(rr)||rr.length>1000)throw new Error('Tiedoston muoto ei kelpaa.');const safe=rr.map((x,i)=>{if(!x||typeof x!=='object'||typeof x.title!=='string')throw new Error('Virheellinen tehtävä.');const kind=['task','lesson','end'].includes(x.kind)?x.kind:'task';const date=typeof x.date==='string'&&(/^\d{4}-\d{2}-\d{2}$/.test(x.date)||x.date==='')?x.date:'';return {id:String(x.id||('import-'+i)).slice(0,100),date,title:x.title.slice(0,300),course:String(x.course||'Oma merkintä').slice(0,200),kind,time:String(x.time||'').slice(0,40),done:!!x.done,note:String(x.note||'').slice(0,1000),url:typeof x.url==='string'&&/^https:\/\//.test(x.url)?x.url:'',custom:!!x.custom}});if(records.length&&!confirm('Korvataanko nykyiset merkinnät tuoduilla tiedoilla?'))return;records=safe;save();offset=0;render();alert('Opintotiedot tuotu onnistuneesti ('+records.length+' merkintää).');}catch(ex){alert('Tuonti epäonnistui: '+ex.message)}};
host.querySelector('#exportBtn').onclick=()=>{const payload=JSON.stringify({format:'opintokeskus-1',records},null,2);const blob=new Blob([payload],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='opintokeskus-varmuuskopio.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1500)};
host.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.day;render()});host.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;render()});
host.querySelector('#prev').onclick=()=>{offset--;render()};host.querySelector('#next').onclick=()=>{offset++;render()};host.querySelector('#today').onclick=()=>{offset=0;render()};host.querySelector('#addBtn').onclick=()=>{formOpen=!formOpen;render()};host.querySelector('#showDone').onchange=e=>{showDone=e.target.checked;render()};host.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{filter=x.dataset.filter;render()});host.querySelectorAll('[data-check]').forEach(x=>x.onclick=()=>{let e=records.find(t=>t.id===x.dataset.check);if(e){const oldDone=!!e.done;e.done=!e.done;if(!e.custom){if(e._local){if(e.done===e._originDone){delete e._local;delete e._originDone;}}else{e._local=true;e._originDone=oldDone;}}save();render()}});host.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{records=records.filter(t=>t.id!==x.dataset.delete);save();render()});host.querySelector('#newForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),title=String(fd.get('title')||'').trim();if(!title)return;records.push({id:'mine-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),date:String(fd.get('date')||''),title,course:String(fd.get('course')||'Oma merkintä'),kind:String(fd.get('kind')||'task'),time:'',done:false,note:'',url:'',custom:true});formOpen=false;save();render()};
}
render();syncFromCloud();setInterval(syncFromCloud,60000);
})();
