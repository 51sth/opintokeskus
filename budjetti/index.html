<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="theme-color" content="#edf1f3"><title>Budjetti</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f3;color:#263445;font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:750px;margin:auto;padding:18px 12px 80px}h1{font-size:26px;margin:12px 0 22px}h2{margin:0;font-size:22px}.month{background:white;border-radius:17px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #2432440c}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}.section{border-radius:12px;padding:14px;margin:14px 0}.in{background:#eaf5ed}.out{background:#faefed}.result{background:#e7f0fb}.sectionhead,.item,.total,.r{display:flex;justify-content:space-between;align-items:center;gap:10px}.sectionhead{margin-bottom:11px}.item{padding:9px 0;border-bottom:1px solid #0001}.item span{min-width:0;overflow-wrap:anywhere}.item strong{white-space:nowrap;font-weight:600}.in strong,.in h3{color:#287248}.out h3{color:#a6463e}.out strong{color:#9a413b}.result strong{color:#245f9c}.total{font-weight:700;padding-top:13px}h3{margin:0;font-size:18px}button{border:0;border-radius:8px;padding:8px 12px;background:#fff;color:#284b70;cursor:pointer;font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #245f9c}button.add{border:1px solid #bccbda}.mini{padding:2px 8px;border:1px solid #ddd}.paid{color:#287248!important;text-decoration:line-through} .approx{color:#a16c13!important}.small{font-size:13px;color:#697686}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.actions button{border:1px solid #ccd7df}input{padding:10px;border:1px solid #cbd5dd;border-radius:8px;font:inherit;max-width:100%}.editor{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}.editor input:first-child{flex:2 1 180px}.editor input:nth-child(2){flex:1 1 100px}.editor button{background:#245f9c;color:white}.check{accent-color:#287248;width:18px;height:18px;cursor:pointer}.rowtext{display:flex;align-items:center;gap:7px}.right{display:flex;align-items:center;gap:4px}.collapse{background:#edf1f3}.negative{color:#b22!important}.hint{padding:10px;background:#fff8e4;border-radius:10px;margin:15px 0}.hidden{display:none} .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style></head><body><div id="authview" style="margin:45px auto;padding:24px;max-width:440px;background:white;border-radius:16px"><h2>Budjetti – kirjautuminen</h2><p class="small">Rekisteröidy sähköpostilla, vahvista sähköposti ja kirjaudu sisään.</p><p id="authmsg">Kirjautumisen asetuksia tarkistetaan.</p><input type="email" id="aemail" placeholder="Sähköposti" autocomplete="email" style="padding:12px;margin:8px 0;display:block;width:100%;border:1px solid #ccd7df;border-radius:8px"><input type="password" id="apass" placeholder="Salasana" autocomplete="current-password" style="padding:12px;margin:8px 0;display:block;width:100%;border:1px solid #ccd7df;border-radius:8px"><p><button onclick="authAct('login')">Kirjaudu</button> <button onclick="authAct('register')">Rekisteröidy</button></p><p><button onclick="authAct('reset')">Unohtunut salasana</button><button onclick="authAct('resend')">Lähetä vahvistus</button><button onclick="authAct('check')">Tarkista vahvistus</button></p></div><main id="privateview" hidden><button onclick="authAct('logout')">Kirjaudu ulos</button><span id="syncmsg"></span><div class="toolbar"><h1>BUDJETTI <span id="year"></span></h1><div class="actions"><button onclick="changeYear(-1)">‹</button><button onclick="changeYear(1)">›</button></div></div><div class="actions"><button onclick="applyKelaPayments()">Päivitä Kelan maksut 10–11/2026</button></div><div class="actions"><button onclick="download()">Vie varmuuskopio</button><button onclick="document.getElementById('upload').click()">Tuo varmuuskopio</button><input id="upload" class="hidden" type="file" accept="application/json" onchange="upload(event)"></div><div class="small">Jokaisen kuukauden tulot ja menot lasketaan erikseen. Tiedot tallentuvat kirjautuneena pilveen.</div><div id="months"></div></main><script>
const KEY='budget-51sth-v1';let year=new Date().getFullYear();let db={};try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const eur=n=>Number(n||0).toLocaleString('fi-FI',{style:'currency',currency:'EUR'});const num=v=>Number(String(v||'0').replace(',','.'))||0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['TAMMIKUU','HELMIKUU','MAALISKUU','HUHTIKUU','TOUKOKUU','KESÄKUU','HEINÄKUU','ELOKUU','SYYSKUU','LOKAKUU','MARRASKUU','JOULUKUU'];let closed={};const id=(y,m)=>y+'-'+String(m+1).padStart(2,'0');function month(y,m){const k=id(y,m);return db[k]||(db[k]={income:[],expense:[],opening:null})}function save(){localStorage.setItem(KEY,JSON.stringify(db));render();window.cloudSave?.()}function applyKelaPayments(){
if(!confirm('Päivitetään lokakuun kuntoutusraha 606,94 € (29.10.2026) ja marraskuun asumistuki 299,25 € (2.11.2026). Muita tuloja tai menoja ei poisteta. Toiselle maksunsaajalle ohjattua 22,49 € toimeentulotukea ei lisätä käytettävissä oleviin tuloihin. Jatketaanko?'))return;
const items=[{y:2026,m:9,name:'Kuntoutusraha',amount:606.94,date:'29.10.2026'},{y:2026,m:10,name:'Asumistuki',amount:299.25,date:'02.11.2026'}];
for(const v of items){const rows=month(v.y,v.m).income;let row=rows.find(x=>x.name.toLocaleLowerCase('fi-FI')===v.name.toLocaleLowerCase('fi-FI'));if(!row){row={name:v.name};rows.push(row)}row.amount=v.amount;row.paymentDate=v.date;row.approx=false}
save();alert('Kelan maksettavat määrät päivitetty. Muut budjettitiedot säilyivät.');}

// Kertaluonteinen, idempotentti 31.10.2026 toimitettujen erätietojen tuonti.
// Yksittäinen Elisa-rivi ja laite-erät eivät saa tulla laskettua kahteen kertaan.
const DEVICE_PLAN_VERSION='elisa-autolaina-20261031-v1';
function addMonths(y,m,n){let z=y*12+m+n;return [Math.floor(z/12),z%12]}
function planExpense(y,m,name,amount,recurringId,paid=false){
  const rows=month(y,m).expense;
  let r=rows.find(x=>x.planKey===recurringId);
  if(!r)r=rows.find(x=>x.name===name && Math.abs(num(x.amount)-amount)<0.011);
  if(!r){r={name,amount,paid,approx:false,recurring:true,recurringId,planKey:recurringId};rows.push(r)}
  else {r.planKey=recurringId;r.recurringId=recurringId;r.recurring=true}
}
function applyDeviceLoanPlan(){
 if(db._migrationElisaAutolaina===DEVICE_PLAN_VERSION)return false;
 const plans=[
  {name:'Elisa – Honor Magic6 Lite (laite-erä)',monthly:8.30,remaining:66.40},
  {name:'Elisa – AOC CQ32G4VE -näyttö (laite-erä)',monthly:6.90,remaining:89.70},
  {name:'Elisa – PlayStation 5 Slim (laite-erä)',monthly:16.62,remaining:315.78},
  {name:'Elisa – Stadler Form Roger Big (laite-erä)',monthly:11.07,remaining:232.47},
  {name:'Elisa – Kingston XS1000 2 Tt (laite-erä)',monthly:7.18,remaining:208.22}
 ];
 // Erääntymisajankohtia ei näy laskukuvissa: aloitetaan marraskuusta 2026.
 // Ei muuteta lokakuun 2026 laskua eikä jo maksettuja eriä.
 plans.forEach((p,idx)=>{
   let cents=Math.round(p.remaining*100),step=Math.round(p.monthly*100),n=0;
   while(cents>0&&n<120){
     const [y,m]=addMonths(2026,10,n),take=Math.min(cents,step)/100;
     planExpense(y,m,p.name,take,'device-20261031-'+idx+'-'+n);
     cents-=Math.round(take*100);n++;
   }
 });
 // Kuvassa oleva 62,25 € Elisa sisälsi 50,07 € laite-eriä.
 // Puhelinliittymäosuuden arvio on siten 12,18 €.
 // Korvataan vain vanha 62,25 euron laskurivi tulevilla kuukausilla.
 for(let n=0;n<29;n++){
   const [y,m]=addMonths(2026,10,n),rows=month(y,m).expense;
   const existing=rows.find(x=>/^Elisa$/i.test((x.name||'').trim())&&Math.abs(num(x.amount)-62.25)<0.011&&!x.paid);
   if(existing){existing.name='Elisa – puhelinliittymä (arvio)';existing.amount=12.18;existing.approx=true;}
   else if(!rows.some(x=>/Elisa.*(puhelinliittymä|liittymä)/i.test(x.name||''))){
     // Lisää liittymäarvio, jos kuukaudessa ei ole Elisa-riviä ennestään.
     if(!rows.some(x=>/^Elisa$/i.test((x.name||'').trim())))planExpense(y,m,'Elisa – puhelinliittymä (arvio)',12.18,'phone-estimate-'+y+'-'+m);
   }
 }
 // Autolainasta marraskuun 2026 erä on jo maksettu: 540 € alkaa joulukuusta.
 let balance=54000,n=0;
 while(balance>0&&n<100){
   const [y,m]=addMonths(2026,11,n),cents=Math.min(balance,3500);
   const rows=month(y,m).expense;
   const old=rows.find(x=>/^Autolaina$/i.test((x.name||'').trim())&&num(x.amount)===0);
   if(old){old.amount=cents/100;old.paid=false;old.approx=false;old.recurring=true;old.planKey='car-20261031-'+n;old.recurringId=old.planKey}
   else planExpense(y,m,'Autolaina',cents/100,'car-20261031-'+n);
   balance-=cents;n++;
 }
 db._migrationElisaAutolaina=DEVICE_PLAN_VERSION;
 return true;
}
function changeYear(d){year+=d;render()}function total(rows){return rows.reduce((s,r)=>s+num(r.amount),0)}function starting(y,m){return 0}function dueDay(r){let d=String(r.due||'').trim();if(!d)return 99;let n=Number(d.slice(0,2));if(/^\d{4}-\d{2}-\d{2}$/.test(d))n=Number(d.slice(8,10));return n>=1&&n<=31?n:99}
function sortedRows(rows,type){return rows.map((r,i)=>({r,i})).sort((a,b)=>type==='income'?0:Number(!!b.r.recurring)-Number(!!a.r.recurring)||dueDay(a.r)-dueDay(b.r)||a.i-b.i)}
function copyRecurring(y,m,entry,unique){let base=y*12+m;for(let step=1;step<=24;step++){let n=base+step,yy=Math.floor(n/12),mm=n%12,target=month(yy,mm);if(!target.expense.some(x=>x.recurringId===unique)){target.expense.push({...entry,recurringId:unique,paid:false,due:entry.due?String(Math.min(dueDay(entry),new Date(yy,mm+1,0).getDate())).padStart(2,'0')+'.'+String(mm+1).padStart(2,'0')+'.'+yy:''})}}}
function askDue(y,m,previous=''){let value=prompt('Eräpäivä (pp.kk.vvvv tai pelkkä päivä 1–31). Voit jättää tyhjäksi.',previous);if(value===null)return null;value=value.trim();if(!value)return '';let day;if(/^\d{1,2}$/.test(value))day=Number(value);else if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(value)){let parts=value.split('.').map(Number);if(parts[1]!==m+1||parts[2]!==y){alert('Valitse tämän kuukauden eräpäivä.');return null}day=parts[0]}else{alert('Anna eräpäivä muodossa pp.kk.vvvv tai päivän numero.');return null}if(day<1||day>new Date(y,m+1,0).getDate()){alert('Päivä ei kuulu tähän kuukauteen.');return null}return String(day).padStart(2,'0')+'.'+String(m+1).padStart(2,'0')+'.'+y}
function add(y,m,type){let name=prompt(type==='income'?'Tulon nimi':'Menon nimi');if(!name?.trim())return;let amount=prompt('Summa euroina (arvion voi merkitä myöhemmin)', '0');if(amount===null)return;let entry={name:name.trim(),amount:num(amount),paid:false,approx:false};if(type==='expense'){let due=askDue(y,m);if(due===null)return;entry.due=due;entry.recurring=confirm('Onko tämä kuukausittain toistuva lasku?\\nOK = toistuva, Peruuta = kertaluonteinen');if(entry.recurring)entry.recurringId='rec-'+Date.now()+'-'+Math.random().toString(36).slice(2)}month(y,m)[type].push(entry);if(entry.recurring)copyRecurring(y,m,entry,entry.recurringId);save()}
function edit(y,m,type,i){let x=month(y,m)[type][i];let name=prompt('Nimi',x.name);if(name===null)return;let amount=prompt('Summa euroina',String(x.amount).replace('.',','));if(amount===null)return;let due=type==='expense'?askDue(y,m,x.due||''):'';if(due===null)return;let recurring=type==='expense'?confirm('Onko tämä kuukausittain toistuva lasku?\\nOK = toistuva, Peruuta = kertaluonteinen'):false;x.name=name.trim()||x.name;x.amount=num(amount);if(type==='expense'){x.due=due;x.recurring=recurring;if(recurring&&!x.recurringId)x.recurringId='rec-'+Date.now()+'-'+Math.random().toString(36).slice(2);if(recurring)copyRecurring(y,m,x,x.recurringId)}save()}
function del(y,m,type,i){if(confirm('Poistetaanko tämä rivi?')){month(y,m)[type].splice(i,1);save()}}function toggle(y,m,i){let x=month(y,m).expense[i];x.paid=!x.paid;save()}function approx(y,m,i){let x=month(y,m).expense[i];x.approx=!x.approx;save()}function opening(y,m){let s=prompt('Kuukauden alkusaldo euroina. Tyhjä = edellisen kuukauden saldo.',month(y,m).opening??'');if(s===null)return;month(y,m).opening=s.trim()===''?null:num(s);save()}function render(){document.getElementById('year').textContent=year;let html='';for(let m=0;m<12;m++){let o=month(year,m),k=id(year,m),start=starting(year,m),ins=total(o.income),outs=total(o.expense),left=ins-outs,collapsed=closed[k]??(!(year===new Date().getFullYear() && m===new Date().getMonth()));html+='<section class="month"><div class="heading" onclick="closed[\''+k+'\']=!'+collapsed+';render()"><h2>'+names[m]+'</h2><div>'+eur(left)+' <span class="small">'+(collapsed?'▼':'▲')+'</span></div></div>';if(!collapsed){for(let type of ['income','expense']){let isIn=type==='income',rows=o[type];html+='<div class="section '+(isIn?'in':'out')+'"><div class="sectionhead"><h3>'+(isIn?'Tulot':'Menot')+'</h3><button class="add" onclick="add('+year+','+m+',\''+type+'\')">+ Lisää</button></div>';sortedRows(rows,type).forEach(({r,i})=>{html+='<div class="item"><div class="rowtext">'+(!isIn?'<input class="check" aria-label="Maksettu" type="checkbox" '+(r.paid?'checked':'')+' onchange="toggle('+year+','+m+','+i+')">':'')+'<span class="'+(r.paid&&!isIn?'paid':'')+'">'+esc(r.name)+'</span>'+(isIn&&r.paymentDate?'<span class="small">Maksupäivä '+esc(r.paymentDate)+'</span>':'')+(!isIn?'<span class="small">'+(r.recurring?'↻ ':'')+(r.due?'Eräpäivä '+esc(r.due):'Ei eräpäivää')+'</span>':'')+'</div><div class="right"><strong class="'+(r.approx?'approx':'')+'">'+eur(r.amount)+(r.approx?' ?':'')+'</strong><button title="Muokkaa" class="mini" onclick="edit('+year+','+m+',\''+type+'\','+i+')">✎</button>'+(!isIn?'<button title="Arvio" class="mini" onclick="approx('+year+','+m+','+i+')">?</button>':'')+'<button title="Poista" class="mini" onclick="del('+year+','+m+',\''+type+'\','+i+')">×</button></div></div>'});html+='<div class="total"><span>Yhteensä</span><strong>'+eur(isIn?ins:outs)+'</strong></div></div>'}html+='<div class="section result"><div class="total"><span>Kuukauden tulot − menot</span><strong>'+eur(ins-outs)+'</strong></div><div class="total"><span>Kuukaudesta jää</span><strong class="'+(left<0?'negative':'')+'">'+eur(left)+'</strong></div><p class="small">Jokainen kuukausi lasketaan erikseen. Maksetut laskut pysyvät kokonaismenoissa.</p></div>'}html+='</section>'}document.getElementById('months').innerHTML=html}function download(){let blob=new Blob([JSON.stringify({version:1,months:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='budjetti-varmuuskopio.json';a.click();URL.revokeObjectURL(url)}async function upload(e){let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text()),v=j.months||j;if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Virheellinen tiedosto');if(!confirm('Korvataanko selaimen nykyiset budjettitiedot varmuuskopiolla?'))return;db=v;save()}catch(err){alert('Tiedoston tuonti ei onnistunut: '+err.message)}finally{e.target.value=''}}render();
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,reload,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const cfg={apiKey:'AIzaSyAo9Pw-CixeN-hGCQUvFyu6V9i1gKmQlRE',authDomain:'budjetti-f96d2.firebaseapp.com',projectId:'budjetti-f96d2',storageBucket:'budjetti-f96d2.firebasestorage.app',messagingSenderId:'592770531015',appId:'1:592770531015:web:6c0fb091da814e870888e2'};
const msg=document.getElementById('authmsg'),box=document.getElementById('authview'),privateView=document.getElementById('privateview');
if(!cfg.apiKey){msg.textContent='Firebase-asetukset puuttuvat. Kirjautuminen ei ole käytössä.'}
else {
const app=initializeApp(cfg),a=getAuth(app),fs=getFirestore(app),sync=document.getElementById('syncmsg');
let active=false,job=Promise.resolve(),timer=null;
async function enter(u){active=false;privateView.hidden=true;box.hidden=false;if(!u){msg.textContent='Kirjaudu tai rekisteröidy.';return}await reload(u);if(!u.emailVerified){msg.textContent='Vahvista sähköpostisi ja valitse Tarkista vahvistus.';return}try{const snapshot=await getDoc(doc(fs,'budgets',u.uid));if(snapshot.exists()){db=snapshot.data().months||{}}else{const old=JSON.parse(localStorage.getItem(KEY)||'{}');db=Object.keys(old).length&&confirm('Tuodaanko tämän selaimen budjettitiedot käyttäjätilillesi?')?old:{};await setDoc(doc(fs,'budgets',u.uid),{months:db})}const appliedPlan=applyDeviceLoanPlan();localStorage.setItem(KEY,JSON.stringify(db));active=true;privateView.hidden=false;box.hidden=true;sync.textContent=' Kirjautuneena: '+u.email+' · Pilvitallennus käytössä';render();if(appliedPlan)window.cloudSave?.()}catch(e){msg.textContent='Tietoja ei voitu ladata: '+e.message}}
window.cloudSave=()=>{if(!active||!a.currentUser)return;clearTimeout(timer);const copy=JSON.parse(JSON.stringify(db)),uid=a.currentUser.uid;sync.textContent=' Tallennetaan…';timer=setTimeout(()=>{job=job.catch(()=>{}).then(()=>setDoc(doc(fs,'budgets',uid),{months:copy})).then(()=>sync.textContent=' Tallennettu').catch(e=>sync.textContent=' Virhe: '+e.message)},500)};
window.authAct=async type=>{const email=document.getElementById('aemail').value.trim(),pass=document.getElementById('apass').value;try{if(type==='register'){const r=await createUserWithEmailAndPassword(a,email,pass);await sendEmailVerification(r.user);msg.textContent='Vahvistusviesti lähetetty.'}else if(type==='login')await signInWithEmailAndPassword(a,email,pass);else if(type==='reset'){await sendPasswordResetEmail(a,email);msg.textContent='Palautusviesti lähetetty.'}else if(type==='resend'){await sendEmailVerification(a.currentUser);msg.textContent='Vahvistusviesti lähetetty.'}else if(type==='check')await enter(a.currentUser);else if(type==='logout'){clearTimeout(timer);await job.catch(()=>{});await signOut(a);db={};render()}}catch(e){msg.textContent='Virhe: '+(e.code||e.message)}};
onAuthStateChanged(a,u=>enter(u).catch(e=>msg.textContent=e.message));
}</script></body></html>
