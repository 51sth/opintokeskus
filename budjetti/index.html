<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf1f3"><title>Budjetti</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f3;color:#263445;font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:750px;margin:auto;padding:18px 12px 80px}h1{font-size:26px;margin:12px 0 22px}h2{margin:0;font-size:22px}.month{background:white;border-radius:17px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #2432440c}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}.section{border-radius:12px;padding:14px;margin:14px 0}.in{background:#eaf5ed}.out{background:#faefed}.result{background:#e7f0fb}.sectionhead,.item,.total,.r{display:flex;justify-content:space-between;align-items:center;gap:10px}.sectionhead{margin-bottom:11px}.item{padding:9px 0;border-bottom:1px solid #0001}.item span{min-width:0;overflow-wrap:anywhere}.item strong{white-space:nowrap;font-weight:600}.in strong,.in h3{color:#287248}.out h3{color:#a6463e}.out strong{color:#9a413b}.result strong{color:#245f9c}.total{font-weight:700;padding-top:13px}h3{margin:0;font-size:18px}button{border:0;border-radius:8px;padding:8px 12px;background:#fff;color:#284b70;cursor:pointer;font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #245f9c}button.add{border:1px solid #bccbda}.mini{padding:2px 8px;border:1px solid #ddd}.paid{color:#287248!important;text-decoration:line-through} .approx{color:#a16c13!important}.small{font-size:13px;color:#697686}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.actions button{border:1px solid #ccd7df}input{padding:10px;border:1px solid #cbd5dd;border-radius:8px;font:inherit;max-width:100%}.editor{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}.editor input:first-child{flex:2 1 180px}.editor input:nth-child(2){flex:1 1 100px}.editor button{background:#245f9c;color:white}.check{accent-color:#287248;width:18px;height:18px;cursor:pointer}.rowtext{display:flex;align-items:center;gap:7px}.right{display:flex;align-items:center;gap:4px}.collapse{background:#edf1f3}.negative{color:#b22!important}.hint{padding:10px;background:#fff8e4;border-radius:10px;margin:15px 0}.hidden{display:none} .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style></head><body><main><div class="toolbar"><h1>BUDJETTI <span id="year"></span></h1><div class="actions"><button onclick="changeYear(-1)">‹</button><button onclick="changeYear(1)">›</button></div></div><div class="actions"><button onclick="download()">Vie varmuuskopio</button><button onclick="document.getElementById('upload').click()">Tuo varmuuskopio</button><input id="upload" class="hidden" type="file" accept="application/json" onchange="upload(event)"></div><div class="small">Tallennus tässä selaimessa. Eri laitteiden synkronointi edellyttää myöhemmin Firebase-kirjautumisen käyttöönottoa.</div><div id="months"></div></main><script>
const KEY='budget-51sth-v1';let year=2026;let db={};try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const eur=n=>Number(n||0).toLocaleString('fi-FI',{style:'currency',currency:'EUR'});const num=v=>Number(String(v||'0').replace(',','.'))||0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['TAMMIKUU','HELMIKUU','MAALISKUU','HUHTIKUU','TOUKOKUU','KESÄKUU','HEINÄKUU','ELOKUU','SYYSKUU','LOKAKUU','MARRASKUU','JOULUKUU'];let closed={};const id=(y,m)=>y+'-'+String(m+1).padStart(2,'0');function month(y,m){const k=id(y,m);return db[k]||(db[k]={income:[],expense:[],opening:null})}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function changeYear(d){year+=d;render()}function total(rows){return rows.reduce((s,r)=>s+num(r.amount),0)}function starting(y,m){const key=id(y,m);if(db[key]?.opening!==null&&db[key]?.opening!==undefined)return num(db[key].opening);if(y<2026)return 0;let py=m===0?y-1:y,pm=m===0?11:m-1;if(py<2026)return 0;let previous=month(py,pm);return starting(py,pm)+total(previous.income)-total(previous.expense)}function add(y,m,type){let name=prompt(type==='income'?'Tulon nimi':'Menon nimi');if(!name?.trim())return;let amount=prompt('Summa euroina (arvion voi merkitä myöhemmin)', '0');if(amount===null)return;month(y,m)[type].push({name:name.trim(),amount:num(amount),paid:false,approx:false});save()}function edit(y,m,type,i){let x=month(y,m)[type][i];let name=prompt('Nimi',x.name);if(name===null)return;let amount=prompt('Summa euroina',String(x.amount).replace('.',','));if(amount===null)return;x.name=name.trim()||x.name;x.amount=num(amount);save()}function del(y,m,type,i){if(confirm('Poistetaanko tämä rivi?')){month(y,m)[type].splice(i,1);save()}}function toggle(y,m,i){let x=month(y,m).expense[i];x.paid=!x.paid;save()}function approx(y,m,i){let x=month(y,m).expense[i];x.approx=!x.approx;save()}function opening(y,m){let s=prompt('Kuukauden alkusaldo euroina. Tyhjä = edellisen kuukauden saldo.',month(y,m).opening??'');if(s===null)return;month(y,m).opening=s.trim()===''?null:num(s);save()}function render(){document.getElementById('year').textContent=year;let html='';for(let m=0;m<12;m++){let o=month(year,m),k=id(year,m),start=starting(year,m),ins=total(o.income),outs=total(o.expense),left=start+ins-outs,collapsed=closed[k]??(year===2026?m<9||m>11:true);html+='<section class="month"><div class="heading" onclick="closed[\''+k+'\']=!'+collapsed+';render()"><h2>'+names[m]+'</h2><div>'+eur(left)+' <span class="small">'+(collapsed?'▼':'▲')+'</span></div></div>';if(!collapsed){html+='<p class="small">Alkusaldo: <button class="mini" onclick="opening('+year+','+m+')">'+eur(start)+' ✎</button></p>';for(let type of ['income','expense']){let isIn=type==='income',rows=o[type];html+='<div class="section '+(isIn?'in':'out')+'"><div class="sectionhead"><h3>'+(isIn?'Tulot':'Menot')+'</h3><button class="add" onclick="add('+year+','+m+',\''+type+'\')">+ Lisää</button></div>';rows.forEach((r,i)=>{html+='<div class="item"><div class="rowtext">'+(!isIn?'<input class="check" aria-label="Maksettu" type="checkbox" '+(r.paid?'checked':'')+' onchange="toggle('+year+','+m+','+i+')">':'')+'<span class="'+(r.paid&&!isIn?'paid':'')+'">'+esc(r.name)+'</span></div><div class="right"><strong class="'+(r.approx?'approx':'')+'">'+eur(r.amount)+(r.approx?' ?':'')+'</strong><button title="Muokkaa" class="mini" onclick="edit('+year+','+m+',\''+type+'\','+i+')">✎</button>'+(!isIn?'<button title="Arvio" class="mini" onclick="approx('+year+','+m+','+i+')">?</button>':'')+'<button title="Poista" class="mini" onclick="del('+year+','+m+',\''+type+'\','+i+')">×</button></div></div>'});html+='<div class="total"><span>Yhteensä</span><strong>'+eur(isIn?ins:outs)+'</strong></div></div>'}html+='<div class="section result"><div class="total"><span>Kuukaudesta jää</span><strong class="'+(left<0?'negative':'')+'">'+eur(left)+'</strong></div><p class="small">Sisältää alkusaldon. Maksetut laskut pysyvät kokonaismenoissa.</p></div>'}html+='</section>'}document.getElementById('months').innerHTML=html}function download(){let blob=new Blob([JSON.stringify({version:1,months:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='budjetti-varmuuskopio.json';a.click();URL.revokeObjectURL(url)}async function upload(e){let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text()),v=j.months||j;if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Virheellinen tiedosto');if(!confirm('Korvataanko selaimen nykyiset budjettitiedot varmuuskopiolla?'))return;db=v;save()}catch(err){alert('Tiedoston tuonti ei onnistunut: '+err.message)}finally{e.target.value=''}}render();
</script></body></html>
