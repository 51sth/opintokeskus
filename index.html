:13px}.dayhead small{color:#6a829b;font-size:12px}.item{display:flex;align-items:flex-start;gap:10px;margin:9px;border-radius:12px;padding:11px 12px;border:1px solid transparent}.item.task{background:#fff4e5;border-color:#f5e4ca}.item.lesson{background:#edf3ff;border-color:#dce7fb}.item.end{background:#f1eaff;border-color:#e8d9f7}.item.done{background:#e8f5e9;border-color:#cfe9d5}.check{border:2px solid #b1a087;width:21px;height:21px;min-width:21px;border-radius:7px;background:#fff;color:#247449;font-size:15px;line-height:16px;padding:0;margin-top:2px;font-weight:900}.check.checked{background:#d9f0df;border-color:#8fc5a2}.symbol{width:23px;height:23px;min-width:23px;display:flex;align-items:center;justify-content:center;color:#5570a9;font-size:18px}.itembody{flex:1;min-width:0}.itemtitle{font-size:14px;font-weight:750;line-height:1.4}.item.done .itemtitle{text-decoration:line-through;text-decoration-color:#84ad8b;color:#3a684c}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}.meta span{font-size:11px;color:#6b7180}.pill{border-radius:6px;padding:3px 6px;background:#ffffffb8!important;color:#566072!important;font-weight:650}.note{font-size:12px;color:#687182;margin-top:6px;line-height:1.45}.note a{color:#265a98;text-decoration:underline}.remove{background:transparent;border:0;font-size:19px;color:#9aa4b4;align-self:flex-start}.muted{color:#6e7c8e}.blank{background:white;border:1px dashed #cfdae8;border-radius:14px;padding:28px 18px;text-align:center;color:#718098}.sectionHead{margin:20px 0 10px;font-size:16px;font-weight:850}.unscheduled{margin-top:19px;background:#fff;border:1px solid #e3e9f2;border-radius:14px;padding:14px}.unscheduled summary{cursor:pointer;font-weight:800;color:#486282}.unscheduled .item{margin:9px 0}.addpanel{display:none;background:white;border:1px solid #d9e5f1;border-radius:15px;padding:15px;margin:15px 0}.addpanel.show{display:block}.addgrid{display:grid;grid-template-columns:2fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:#4c6480}.field input,.field select{border:1px solid #d7e1ee;border-radius:9px;padding:9px;width:100%;background:white;color:#2d435b}.submitrow{display:flex;justify-content:flex-end;margin-top:10px}.foot{font-size:12px;line-height:1.5;color:#77849a;margin-top:18px}.tinyLink{color:#345f99;font-size:12px;font-weight:700}.header-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}@media(max-width:620px){.app{padding:10px}.hero{padding:20px}.toolbar .dates{width:100%}.stats{gap:6px}.stat{padding:9px}.stat strong{font-size:22px}.addgrid{grid-template-columns:1fr}.toggle{margin-left:0}.actions{width:100%}}

.viewbar{display:flex;gap:6px;align-items:center;margin:18px 0 2px}

</style></head><body><div class="app" id="app"></div><script>
(function(){
'use strict';
const START=[];
const KEY='opintokeskus_pysyva_v2';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let records=Array.isArray(saved.records)?saved.records:START;
let cloudStatus='Haetaan ajantasaisia tietoja GitHubista…';
let lastCloudSync='';
let offset=0,filter='all',showDone=true,formOpen=false,view='week',selectedDate='',unscheduledOpen=true,quickAddOpen=false,pickedTaskId='';
const host=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify({records}))}catch(e){}}
async function syncFromCloud(){
  try{
    const res=await fetch('./data.json?v='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!Array.isArray(data.records)||data.records.length>1000)throw new Error('Virheellinen tietomuoto');
    const old=new Map(records.map(x=>[String(x.id),x]));
    const ids=new Set();
    const next=data.records.map((entry,i)=>{
      if(!entry||typeof entry.title!=='string'||!entry.id)throw new Error('Virheellinen merkintä');
      const x={...entry,id:String(entry.id),done:!!entry.done,custom:false};
      ids.add(x.id);
      const previous=old.get(x.id);
      if(previous&&previous._local===true&&previous._originDone===x.done){
        x.done=!!previous.done;
        x._local=true;
        x._originDone=previous._originDone;
      }
      if(previous&&previous._localDate===true&&previous._originDate===String(entry.date||'')){
        x.date=previous.date||'';
        x._localDate=true;
        x._originDate=previous._originDate;
      }
      return x;
    });
    const extras=records.filter(x=>x.custom&&!ids.has(x.id));
    records=[...next,...extras];
    cloudStatus='Ajantasaiset tiedot GitHubista';
    lastCloudSync=new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'});
    save();render();
  }catch(err){
    cloudStatus='Yhteys ei onnistunut – näytetään selaimeen tallennetut tiedot';
    render();
  }
}
function dateObj(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dateStr(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayAdd(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function formatDate(d){return new Intl.DateTimeFormat('fi-FI',{day:'numeric',month:'numeric',year:'numeric'}).format(d)}
function dateHead(d){return new Intl.DateTimeFormat('fi-FI',{weekday:'long',day:'numeric',month:'long'}).format(d)}
function enc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sort(a,b){return (a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99')||a.title.localeCompare(b.title,'fi')}
function deadlineInfo(e){
 const explicit=String(e.deadline||'');
 if(/^\d{4}-\d{2}-\d{2}$/.test(explicit)&&dateStr(dateObj(explicit))===explicit)return {date:explicit,confirmed:true};
 const ends=records.filter(r=>r.kind==='end'&&r.course===e.course&&/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')).map(r=>r.date).sort();
 return {date:ends[0]||'',confirmed:false};
}
function item(e,inPool=false){
 const klass=e.done?'done':e.kind;
 const kind=e.kind==='task'?'Tehtävä':e.kind==='lesson'?'Opetus / tapahtuma':'Kurssi päättyy';
 const check=e.kind==='task'?`<button type="button" class="check ${e.done?'checked':''}" data-check="${enc(e.id)}" aria-label="Merkitse ${e.done?'tekemättömäksi':'tehdyksi'}">${e.done?'✓':''}</button>`:`<span class="symbol">${e.kind==='lesson'?'▣':'◈'}</span>`;
 const link=e.url?` <a href="${enc(e.url)}" target="_blank" rel="noopener noreferrer">Avaa ohje</a>`:'';
 const draggable=inPool&&e.kind==='task';
 const dragSymbol=draggable?'<span class="draghandle" aria-hidden="true" title="Vedä tehtävä kalenteriin">⠿</span>':'';
 const due=inPool?deadlineInfo(e):null;
 const dueLine=inPool?(due.date?`<div class="duehint">${due.confirmed?'Määräaika: ':'Kurssi päättyy: '}${formatDate(dateObj(due.date))}${due.confirmed?'':' · tehtävän deadline vahvistamatta'}</div>`:'<div class="duehint">Määräaika ei tiedossa</div>'):'';
 const choose=draggable?`<button type="button" class="pool-pick ${pickedTaskId===e.id?'active':''}" data-pick-task="${enc(e.id)}" aria-pressed="${pickedTaskId===e.id?'true':'false'}">${pickedTaskId===e.id?'✓ Valittu – klikkaa kalenteripäivää':'Valitse sijoitettavaksi'}</button>`:'';

 const remove=e.kind==='task'&&!inPool&&e.date?`<button type="button" class="remove-day" data-unschedule="${enc(e.id)}" title="Poista kalenterista ja palauta päiväämättömiin" aria-label="Palauta tehtävä ${enc(e.title)} päiväämättömiin">×</button>`:'';
 const deleteOther=e.custom&&e.kind!=='task'?`<button type="button" class="remove" data-delete="${enc(e.id)}" title="Poista oma tapahtumamerkintä">×</button>`:'';
 return `<article class="item ${klass} ${draggable?'drag-source':''}" ${draggable?`draggable="true" data-drag-id="${enc(e.id)}"`:''}>${dragSymbol}${check}<div class="itembody"><div class="itemtitle">${enc(e.title)}</div><div class="meta"><span class="pill">${enc(e.course)}</span><span class="pill">${kind}</span>${e.time?`<span class="pill">klo ${enc(e.time)}</span>`:''}${e.done?'<span class="pill">✓ Tehty</span>':''}</div>${e.note||link?`<div class="note">${enc(e.note)}${link}</div>`:''}${dueLine}${choose}</div>${remove}${deleteOther}</article>`;
}

function moveTask(id,targetDate){
 const e=records.find(r=>r.id===id);
 if(!e||e.kind!=='task')return;
 if(targetDate!==''&&(!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)||dateStr(dateObj(targetDate))!==targetDate))return;
 const origin=e._localDate?e._originDate:String(e.date||'');
 e.date=targetDate;
 if(!e.custom){
   if(targetDate===origin){delete e._localDate;delete e._originDate}
   else{e._localDate=true;e._originDate=origin}
 }
 save();
 if(targetDate){
   const today=new Date(),start=dayAdd(new Date(today.getFullYear(),today.getMonth(),today.getDate()),-((today.getDay()+6)%7));
   const difference=Math.round((Date.UTC(...targetDate.split('-').map(Number).map((v,i)=>i===1?v-1:v))-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);
   offset=Math.floor(difference/14);
   selectedDate=targetDate;
   filter='all';view='week';
 }
 render();
}
function renderList(visible,groups,today){
 if(!visible.length)return '<div class="blank">Ei tapahtumia tällä aikavälillä valituilla suodattimilla.</div>';
 return Object.keys(groups).map(ds=>{
   const d=dateObj(ds),delta=Math.round((d-today)/86400000);
   const extra=delta===0?'Tänään':delta===1?'Huomenna':'';
   return `<section class="day"><div class="dayhead"><strong>${dateHead(d)}</strong>${extra?`<small>· ${extra}</small>`:''}</div>${groups[ds].map(item).join('')}</section>`;
 }).join('');
}
function renderWeeks(begin,groups,today){
 const todayStr=dateStr(today);
 const startStr=dateStr(begin);
 const endStr=dateStr(dayAdd(begin,14));
 if(!selectedDate||selectedDate<startStr||selectedDate>=endStr){
   selectedDate=todayStr>=startStr&&todayStr<endStr?todayStr:startStr;
   quickAddOpen=false;
 }
 const weekRows=[0,7].map(dayOffset=>{
   const start=dayAdd(begin,dayOffset);
   const finish=dayAdd(start,6);
   const cells=Array.from({length:7},(_,i)=>{
     const d=dayAdd(start,i);
     const key=dateStr(d),entries=groups[key]||[];
     const pending=entries.filter(x=>x.kind==='task'&&!x.done).length;
     const completed=entries.filter(x=>x.kind==='task'&&x.done).length;
     const classes=entries.filter(x=>x.kind==='lesson').length;
     const ends=entries.filter(x=>x.kind==='end').length;
     const dayName=['Su','Ma','Ti','Ke','To','Pe','La'][d.getDay()];
     const previews=entries.slice(0,3).map(x=>`<span class="daypreview ${x.kind==='task'?(x.done?'task-done':'task-pending'):'kind-'+enc(x.kind)}" title="${enc(x.title)}">${x.kind==='task'?(x.done?'✓ ':'○ '):''}${enc(x.title)}</span>`).join('');
     return `<button type="button" class="weekday ${key===selectedDate?'selected':''} ${key===todayStr?'todaymark':''} ${i>4?'weekend':''} ${pending?'has-pending':completed?'only-done':''}" data-day="${key}" aria-label="${enc(dateHead(d))}, ${entries.length} merkintää" aria-pressed="${key===selectedDate?'true':'false'}">
       <span class="daylabel">${dayName}</span><span class="daynum">${d.getDate()}</span>
       <span class="daybadges">${pending?`<span class="daybadge">${pending}</span>`:''}${completed?`<span class="daybadge done">✓${completed}</span>`:''}${classes?`<span class="daybadge lesson">◉${classes}</span>`:''}${ends?`<span class="daybadge end">◈${ends}</span>`:''}</span>
       ${previews}${key===selectedDate?'<span class="dayplus" aria-hidden="true">+</span>':''}
     </button>`;
   }).join('');
   return `<section class="weekgroup"><div class="weekgrid">${cells}</div></section>`;
 }).join('');
 const chosen=groups[selectedDate]||[];
 const quickForm=quickAddOpen?`<form class="dayquick" id="dayQuickForm"><h3>Uusi merkintä päivälle ${enc(formatDate(dateObj(selectedDate)))}</h3><div class="dayquick-fields">
  <div class="field wide"><label for="dayNewTitle">Tehtävän tai tapahtuman nimi</label><input id="dayNewTitle" name="title" required maxlength="300" placeholder="Esim. luento tai palautettava tehtävä"></div>
  <div class="field"><label for="dayNewKind">Tyyppi</label><select id="dayNewKind" name="kind"><option value="task">Tehtävä</option><option value="lesson">Opetus / tapahtuma</option></select></div>
  <div class="field"><label for="dayNewTime">Kellonaika (valinnainen)</label><input id="dayNewTime" name="time" maxlength="40" placeholder="Esim. 9.00–10.30"></div>
  <div class="field wide"><label for="dayNewCourse">Opintojakso / kurssi (valinnainen)</label><input id="dayNewCourse" name="course" maxlength="200" placeholder="Esim. Communication Skills"></div>
  <div class="field wide"><label for="dayNewNote">Lisätiedot (valinnainen)</label><textarea id="dayNewNote" name="note" maxlength="1000" rows="2" placeholder="Omat muistiinpanot"></textarea></div>
  </div><div class="dayquick-actions"><button type="button" class="btn" id="dayQuickCancel">Peruuta</button><button type="submit" class="btn primary">Tallenna päivälle</button></div></form>`:'';
 const detail=`<section class="daydetails"><div class="daydetails-head"><header>${dateHead(dateObj(selectedDate))}</header><button type="button" class="day-add" id="dayAddBtn" aria-expanded="${quickAddOpen?'true':'false'}" aria-controls="dayQuickForm">${quickAddOpen?'− Sulje lisäys':'+ Lisää tähän päivään'}</button></div>${quickForm}${chosen.length?chosen.map(item).join(''):'<div class="blank">Ei tapahtumia valittuna päivänä.</div>'}</section>`;
 return weekRows+detail;
}

function render(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),begin=dayAdd(dayAdd(today,-((today.getDay()+6)%7)),offset*14),finish=dayAdd(begin,14);const visible=records.filter(e=>e.date&&e.date>=dateStr(begin)&&e.date<dateStr(finish)).sort(sort);const groups={};visible.forEach(e=>(groups[e.date]??=[]).push(e));const undated=records.filter(e=>!e.date).sort((a,b)=>Number(!!a.done)-Number(!!b.done)||(deadlineInfo(a).date||'9999-99-99').localeCompare(deadlineInfo(b).date||'9999-99-99')||a.title.localeCompare(b.title,'fi'));
host.innerHTML=`<header class="hero"><p class="eyebrow">Yhteisöpedagogi · opintojen hallinta</p><h1>Opintokeskus</h1><p>Seuraavan kahden viikon tehtävät, etäopetukset ja kurssien päättymiset yhdessä näkymässä.</p><div class="header-actions"><button class="btn primary" id="addBtn">+ Lisää tehtävä</button><button class="btn" id="importBtn">Tuo varmuuskopio</button><button class="btn" id="exportBtn">Vie varmuuskopio</button><input type="file" id="importFile" accept=".json,application/json" style="display:none"></div><p class="syncState" style="font-size:12px;margin-top:10px">${enc(cloudStatus)}${lastCloudSync?' · päivitetty klo '+enc(lastCloudSync):''}</p></header>
<div class="addpanel ${formOpen?'show':''}" id="addPanel"><form id="newForm"><div class="addgrid"><div class="field"><label for="newTitle">Tehtävän nimi</label><input id="newTitle" name="title" required placeholder="Esim. palautettava essee"></div><div class="field"><label for="newDate">Päivämäärä</label><input id="newDate" name="date" type="date"></div><div class="field"><label for="newCourse">Kurssi</label><input id="newCourse" name="course" placeholder="Valinnainen"></div><div class="field"><label for="newKind">Tyyppi</label><select id="newKind" name="kind"><option value="task">Tehtävä</option><option value="lesson">Opetus / tapahtuma</option><option value="end">Kurssin päättyminen</option></select></div></div><div class="submitrow"><button class="btn primary" type="submit">Tallenna merkintä</button></div></form></div>
<div class="range-only"><button type="button" class="dates" id="rangeSelect" title="Valitse kalenterijakso" aria-label="Kalenterijakso ${formatDate(begin)} – ${formatDate(finish)}. Valitse toinen jakso.">${formatDate(begin)} – ${formatDate(finish)}</button><input type="date" id="rangePicker" class="range-picker" aria-label="Valitse kalenterijakson päivä"></div>
<main class="days">${view==='week'?renderWeeks(begin,groups,today):renderList(visible,groups,today)}</main>
<details class="unscheduled" ${unscheduledOpen?'open':''}><summary>Päiväämättömät tehtävät (${undated.length})</summary><p class="poolhelp">${pickedTaskId?'<span class="pool-active-help">Tehtävä valittu. Klikkaa haluamaasi kalenteripäivää.</span>':'Vedä tehtävä hiirellä kalenteripäivään tai napauta ”Valitse sijoitettavaksi” ja sen jälkeen viikonpäivää. Näytämme varmistamattomien määräaikojen sijasta kurssin päättymispäivän suuntaa-antavana tietona.'} Kalenterin ×-painike palauttaa tehtävän tähän listaan.</p><div class="unscheduledgrid">${undated.length?undated.map(e=>item(e,true)).join(''):'<p class="muted">Ei päiväämättömiä tehtäviä.</p>'}</div></details>
<p class="foot">Kurssien päättymispäivät eivät välttämättä ole tehtävien viimeisiä palautuspäiviä. Kielenhuollon tehtäväpäivät perustuvat aikaisempaan työskentelyaikatauluun. OAMKin heinäkuun 2027 loppupäivä on alustava. Ei muistutusilmoituksia eikä automaattista Google Kalenteri -synkronointia. Laitteella tekemäsi tehtäväkuittaukset tallentuvat kyseisen selaimen paikalliseen muistiin. Ne eivät vielä synkronoidu puhelimen ja tietokoneen välillä. Vie varmuuskopio ennen selaimen tietojen tyhjentämistä tai laitteenvaihtoa. Tämän julkisen sovelluksen yhteinen tehtävälista haetaan GitHubista. Sen tiedot ovat julkisesti luettavissa. Selaimessa tehtävät omat muutokset säilyvät tässä laitteessa, eivätkä siirry automaattisesti GitHubiin.</p>`;
host.querySelector('#importBtn').onclick=()=>host.querySelector('#importFile').click();
host.querySelector('#importFile').onchange=async(ev)=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;if(file.size>2000000){alert('Tiedosto on liian suuri (enintään 2 Mt).');return;}try{const input=JSON.parse(await file.text());const rr=Array.isArray(input)?input:input.records;if(!Array.isArray(rr)||rr.length>1000)throw new Error('Tiedoston muoto ei kelpaa.');const safe=rr.map((x,i)=>{if(!x||typeof x!=='object'||typeof x.title!=='string')throw new Error('Virheellinen tehtävä.');const kind=['task','lesson','end'].includes(x.kind)?x.kind:'task';const date=typeof x.date==='string'&&(/^\d{4}-\d{2}-\d{2}$/.test(x.date)||x.date==='')?x.date:'';return {id:String(x.id||('import-'+i)).slice(0,100),date,title:x.title.slice(0,300),course:String(x.course||'Oma merkintä').slice(0,200),kind,time:String(x.time||'').slice(0,40),done:!!x.done,note:String(x.note||'').slice(0,1000),url:typeof x.url==='string'&&/^https:\/\//.test(x.url)?x.url:'',custom:!!x.custom}});if(records.length&&!confirm('Korvataanko nykyiset merkinnät tuoduilla tiedoilla?'))return;records=safe;save();offset=0;render();alert('Opintotiedot tuotu onnistuneesti ('+records.length+' merkintää).');}catch(ex){alert('Tuonti epäonnistui: '+ex.message)}};
host.querySelector('#exportBtn').onclick=()=>{const payload=JSON.stringify({format:'opintokeskus-1',records},null,2);const blob=new Blob([payload],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='opintokeskus-varmuuskopio.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1500)};
host.querySelector('.unscheduled').addEventListener('toggle',e=>{unscheduledOpen=e.target.open});
host.querySelectorAll('[data-drag-id]').forEach(el=>{
 el.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',el.dataset.dragId);ev.dataTransfer.effectAllowed='move';el.classList.add('dragging')});
 el.addEventListener('dragend',()=>{el.classList.remove('dragging');host.querySelectorAll('.drop-ready').forEach(d=>d.classList.remove('drop-ready'))});
});
host.querySelectorAll('[data-pick-task]').forEach(el=>el.onclick=()=>{pickedTaskId=pickedTaskId===el.dataset.pickTask?'':el.dataset.pickTask;render()});
host.querySelectorAll('[data-day]').forEach(el=>{
 el.onclick=()=>{
  if(pickedTaskId){const taskId=pickedTaskId;pickedTaskId='';moveTask(taskId,el.dataset.day);return;}
  if(selectedDate===el.dataset.day){quickAddOpen=!quickAddOpen;}
  else{selectedDate=el.dataset.day;quickAddOpen=false;}
  render();if(quickAddOpen)host.querySelector('#dayNewTitle')?.focus();
 };
 el.addEventListener('dragover',ev=>{if(!ev.dataTransfer.types.includes('text/plain'))return;ev.preventDefault();ev.dataTransfer.dropEffect='move';el.classList.add('drop-ready')});
 el.addEventListener('dragleave',ev=>{if(!el.contains(ev.relatedTarget))el.classList.remove('drop-ready')});
 el.addEventListener('drop',ev=>{ev.preventDefault();el.classList.remove('drop-ready');const id=ev.dataTransfer.getData('text/plain');if(id)moveTask(id,el.dataset.day)});
});
const dayAddBtn=host.querySelector('#dayAddBtn');
if(dayAddBtn)dayAddBtn.onclick=()=>{quickAddOpen=!quickAddOpen;render();if(quickAddOpen)host.querySelector('#dayNewTitle')?.focus()};
const cancelDay=host.querySelector('#dayQuickCancel');
if(cancelDay)cancelDay.onclick=()=>{quickAddOpen=false;render()};
const quickFormEl=host.querySelector('#dayQuickForm');
if(quickFormEl)quickFormEl.onsubmit=ev=>{
 ev.preventDefault();
 const fd=new FormData(quickFormEl),title=String(fd.get('title')||'').trim().slice(0,300);
 if(!title)return;
 records.push({id:'mine-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),date:selectedDate,title,course:String(fd.get('course')||'').trim().slice(0,200)||'Oma merkintä',kind:fd.get('kind')==='lesson'?'lesson':'task',time:String(fd.get('time')||'').trim().slice(0,40),done:false,note:String(fd.get('note')||'').trim().slice(0,1000),url:'',custom:true});
 quickAddOpen=false;save();render();
};
const periodButton=host.querySelector('#rangeSelect');
const periodInput=host.querySelector('#rangePicker');
periodButton.onclick=()=>{periodInput.value=selectedDate||dateStr(new Date());if(typeof periodInput.showPicker==='function')periodInput.showPicker();else periodInput.click()};
periodButton.onkeydown=ev=>{if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();offset+=ev.key==='ArrowLeft'?-1:1;quickAddOpen=false;render();host.querySelector('#rangeSelect')?.focus()}};
periodInput.onchange=()=>{const target=periodInput.value;if(!target||dateStr(dateObj(target))!==target)return;const firstMonday=dayAdd(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()),-((new Date().getDay()+6)%7));const chosen=dateObj(target);const days=Math.round((Date.UTC(chosen.getFullYear(),chosen.getMonth(),chosen.getDate())-Date.UTC(firstMonday.getFullYear(),firstMonday.getMonth(),firstMonday.getDate()))/86400000);offset=Math.floor(days/14);selectedDate=target;quickAddOpen=false;render()};
host.querySelector('#addBtn').onclick=()=>{formOpen=!formOpen;render()};host.querySelectorAll('[data-check]').forEach(x=>x.onclick=()=>{let e=records.find(t=>t.id===x.dataset.check);if(e){const oldDone=!!e.done;e.done=!e.done;if(!e.custom){if(e._local){if(e.done===e._originDone){delete e._local;delete e._originDone;}}else{e._local=true;e._originDone=oldDone;}}save();render()}});host.querySelectorAll('[data-unschedule]').forEach(x=>x.onclick=()=>moveTask(x.dataset.unschedule,''));
host.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{if(!confirm('Poistetaanko tapahtumamerkintä kokonaan?'))return;records=records.filter(t=>t.id!==x.dataset.delete);save();render()});host.querySelector('#newForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),title=String(fd.get('title')||'').trim();if(!title)return;records.push({id:'mine-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),date:String(fd.get('date')||''),title,course:String(fd.get('course')||'Oma merkintä'),kind:String(fd.get('kind')||'task'),time:'',done:false,note:'',url:'',custom:true});formOpen=false;save();render()};
}
render();syncFromCloud();setInterval(syncFromCloud,60000);
})();
</script></body></html>
