/* Viikkonäkymä */
.viewbar{display:flex;gap:6px;align-items:center;margin:18px 0 2px}
.viewbtn{padding:9px 15px;border:1px solid #d1dfea;border-radius:10px;background:#fff;color:#446078;font-weight:800;font-size:13px}
.viewbtn.active{background:#325a92;color:#fff;border-color:#325a92}
.weekgroup{margin:10px 0 18px}
.weekrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:7px;align-items:stretch}
.weeknumber{display:flex;align-items:center;justify-content:center;min-width:0;border:1px solid #dce5ef;border-radius:12px;background:#edf3f9;color:#355577;font-size:12px;font-weight:800;white-space:nowrap}

.weekday{border:1px solid #dfe7f0;background:#fff;border-radius:12px;min-width:0;min-height:116px;text-align:left;padding:9px 7px;color:#294461;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.weekday:hover{border-color:#8facd0;background:#f9fcff}
.weekday.selected{background:#eaf4ff;border:2px solid #689dd0;padding:8px 6px}
.weekday.todaymark .daynum{border-radius:50%;background:#2d609d;color:#fff;align-self:flex-start;padding:1px 6px}
.weekday.weekend{background:#f8fafc}
.weekday.weekend.selected{background:#eaf4ff}
/* Tehtävien tila näkyy myös viikonpäiväruuduissa. */
.weekday.has-pending,.weekday.weekend.has-pending{background:#fff4e5;border-color:#f5e4ca}
.weekday.only-done,.weekday.weekend.only-done{background:#e8f5e9;border-color:#cfe9d5}
.weekday.selected.has-pending,.weekday.selected.only-done{border-color:#689dd0;box-shadow:inset 0 0 0 1px #689dd0}
.weekday.has-pending:hover{background:#ffefd7}
.weekday.only-done:hover{background:#dff0e3}
.range-only{margin:18px 0 14px;display:flex;align-items:center;flex-wrap:wrap;gap:9px 16px}
.week-picks{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.week-pick{display:inline-flex;gap:5px;align-items:center;white-space:nowrap;font-size:12px;color:#365373;font-weight:750;cursor:pointer;user-select:none}
.week-pick input{accent-color:#365f9b;width:15px;height:15px;margin:0;cursor:pointer}
.week-pick input:disabled{cursor:not-allowed}
.week-reset{background:#fff;border:1px solid #cfdfed;border-radius:8px;color:#3d6187;padding:5px 9px;font-size:11px;font-weight:800}
.week-reset:hover{background:#edf5ff}
.week-count{font-size:11px;color:#61748c;white-space:nowrap}

.range-only .dates:hover{text-decoration:underline;text-underline-offset:3px}
.range-only .dates:focus-visible{outline:2px solid #3c8bce;outline-offset:4px;border-radius:3px}
.range-picker{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.weekday .daylabel{font-size:11px;color:#607994;font-weight:700}

.daybadge.end{background:#eaf4ff;color:#36628a}

.coursemarks{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:2px;min-height:8px}
.coursemark{display:inline-block;flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:var(--course-accent,#9eafc0);border:1px solid #00000018}
.daydetails .item{border-left:6px solid var(--course-accent,#9eafc0)}
.daydetails .item .meta .pill:first-child{background:var(--course-accent,#9eafc0)!important;color:white!important}
.daypreview.task-pending,.daypreview.task-done{
 background:var(--course-accent,#446789);
 color:var(--course-ink,#fff);
 border-left:0;
 padding:4px 5px;
 font-weight:750
}
.preview-state{
 display:inline-flex;align-items:center;justify-content:center;
 border-radius:50%;width:13px;height:13px;margin-right:3px;
 line-height:1;font-size:10px;font-weight:900;vertical-align:middle;
 color:#49330d;background:#ffe3a5
}
.preview-state.state-done{background:#b7edc3;color:#155329}
.daypreview.kind-lesson{background:#dce7fb;color:#365a84}
.daypreview.kind-end{background:#e8d9f7;color:#654884}
.daydetails{background:white;border:1px solid #dce6f0;padding:12px;border-radius:14px;margin-top:15px}
.daydetails header{font-size:15px;font-weight:800;color:#345878;margin:0 0 8px}
.daydetails .item{margin:8px 0}
.daydetails-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.daydetails-head header{margin:0}
.day-add{border:1px solid #a9c5e3;background:#e8f3ff;color:#2d5b8d;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800}
.day-add:hover{background:#d9ebff}
.dayquick{background:#f7fbff;border:1px solid #cfe0f3;border-radius:12px;padding:12px;margin:10px 0 13px}
.dayquick h3{font-size:13px;margin:0 0 10px;color:#365879}
.dayquick-fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:9px}
.dayquick .field.wide{grid-column:1/-1}
.dayquick .field textarea{border:1px solid #d7e1ee;border-radius:9px;padding:9px;width:100%;background:white;color:#2d435b;resize:vertical;min-height:56px;font:inherit}
.dayquick-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:7px;margin-top:10px}

.nextthree{background:#f7fbff;border:1px solid #dbeaf8;border-radius:13px;padding:11px 13px;margin:10px 0}
.nextthree strong{display:block;font-size:13px;color:#36577c;margin-bottom:6px}
.nextthree .nextline{font-size:12px;line-height:1.5;color:#536c87;margin-top:4px}

/* Raahattava tehtäväpankki ja viikonpäivien pudotusalueet */
.unscheduled{margin:16px 0}
.poolhelp{font-size:12px;color:#5c7290;line-height:1.5;margin:10px 0}
.unscheduledgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;align-content:start}
.unscheduled .item{background:var(--course-bg,#fff4e5)!important;border:1px solid var(--course-accent,#b58748);border-left:6px solid var(--course-accent,#b58748);border-radius:10px}
.unscheduled .meta .pill:first-child{background:var(--course-accent,#b58748)!important;color:#fff!important}
.unscheduled .item.done .itemtitle{color:#3a684c}
.unscheduled .item{margin:0;padding:9px;min-width:0}
.unscheduled .note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unscheduled .itemtitle{font-size:13px}
.item.drag-source{cursor:grab}
.item.drag-source:active{cursor:grabbing}
.item.dragging{opacity:.5}
.draghandle{color:#6c849c;font-size:19px;line-height:1.2;align-self:center;user-select:none}
.weekday.drop-ready,.weekday:focus-visible{outline:3px solid #3c8bce;outline-offset:1px;background:#e3f5fc}
.pool-pick{margin-top:8px;background:#fff;border:1px solid #abc4de;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:800;color:#3d6287}
.pool-pick.active{background:#dceefe;border-color:#4c91cf}
.duehint{font-size:11px;color:#62748b;margin-top:7px;line-height:1.35}
.dayplus{margin-top:auto;align-self:flex-end;color:#2564a7;font-size:18px;font-weight:900;line-height:1}
.weekday.selected .dayplus{background:#d6eaff;border-radius:6px;padding:1px 6px}
.pool-active-help{font-weight:750;color:#225f96}
@media(max-width:620px){.dayplus{font-size:16px}.pool-pick{padding:7px 10px}}
.item .remove-day{background:transparent;border:1px solid #e6c6ba;border-radius:7px;padding:3px 6px;font-size:17px;line-height:1;color:#a34432;flex-shrink:0}
.item .remove-day:hover{background:#fff1eb}
@media(max-width:620px){.unscheduled .note{display:none}}

/* Teemaversio 2 – kurssin identiteetti ja tehtävän tila ovat erillisiä.
   Pastellinen kurssiväri täyttää palkin, värillinen vasen raita tunnistaa kurssin.
   Keltainen ja vihreä näkyvät ainoastaan tehtävän tilassa ja päivätason yhteenvedossa. */
:root{
 --ui-canvas:#f6f8fc;--ui-text:#243449;--ui-border:#dce5ef;
 --task-pending:#ffe2a8;--task-pending-text:#674400;
 --task-done:#c9efd4;--task-done-text:#205638
}
body{background:var(--ui-canvas);color:var(--ui-text)}
.hero{background:linear-gradient(112deg,#eaf2fd,#f3f0fb);border-color:#dbe4f2}
.weekday{border-color:var(--ui-border);color:#253a52}
.weekday.has-pending,.weekday.weekend.has-pending{background:#fff7e9;border-color:#eadbbc}
.weekday.only-done,.weekday.weekend.only-done{background:#eff9f1;border-color:#cfe8d6}
.weekday.selected,.weekday.selected.has-pending,.weekday.selected.only-done{
 outline:2px solid #4b88c7;outline-offset:1px
}
.daybadge{background:var(--task-pending);color:var(--task-pending-text)}
.daybadge.done{background:var(--task-done);color:var(--task-done-text)}
/* Sama kokoleveä väri niin keskeneräisissä kuin valmiissa kurssitehtävissä. */
.daypreview,.daypreview.task-pending,.daypreview.task-done,
.daypreview.kind-lesson,.daypreview.kind-end{
 display:flex;align-items:center;gap:4px;
 width:100%;min-width:0;max-width:100%;
 background:var(--course-bg,#e9f0f8)!important;
 color:#243247!important;border-radius:6px;
 border:1px solid var(--course-accent,#607a9c);
 border-left:4px solid var(--course-accent,#607a9c);
 box-shadow:0 1px 0 #00000006;
 padding:5px 5px;line-height:1.25;font-size:10px;font-weight:750;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 text-decoration:none
}
.daypreview .preview-state{
 display:inline-flex;flex:0 0 15px;width:15px;height:15px;
 justify-content:center;align-items:center;
 padding:0;margin:0;border-radius:5px;
 background:var(--task-pending);border:1px solid #dfb969;
 color:var(--task-pending-text);font-size:11px;font-weight:900;line-height:1
}
.daypreview .preview-state.state-done{
 background:var(--task-done);border-color:#82c593;color:var(--task-done-text)
}
.daypreview .preview-title{
 flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
/* Tiiviissä mobiilinäkymässä kurssipisteiden reunat näyttävät tilan. */
.coursemarks{gap:6px}
.coursemark{width:10px;height:10px;flex-basis:10px;border:2px solid white;
 background:var(--course-accent,#607a9c);border-radius:4px;
 box-shadow:0 0 0 1.5px #d9a442}
.coursemark.is-done{box-shadow:0 0 0 1.5px #42a36b}
/* Yhden päivän kortit ja päiväämättömien tehtävien lista käyttävät samaa väriä. */
.daydetails .item.task,.unscheduled .item.task,
.daydetails .item.task.done,.unscheduled .item.task.done{
 background:var(--course-bg,#e9f0f8)!important;
 border:1px solid var(--course-accent,#607a9c);
 border-left:6px solid var(--course-accent,#607a9c);
 color:#25344a
}
.item .meta .pill.course-pill{
 background:#ffffffc7!important;color:#243449!important;
 border:1px solid #ffffffb7;
 border-left:3px solid var(--course-accent,#607a9c);
 padding:3px 7px
}
.item .meta .pill.status-pill{font-weight:850;padding:3px 8px}
.item .meta .pill.status-pill.pending{
 background:var(--task-pending)!important;color:var(--task-pending-text)!important
}
.item .meta .pill.status-pill.complete{
 background:var(--task-done)!important;color:var(--task-done-text)!important
}
.item.task:not(.done) .check{border-color:#c89b48}
.item.done .check.checked{background:var(--task-done);border-color:#57a773;color:var(--task-done-text)}
@media(max-width:620px){
 .weekrow{grid-template-columns:32px minmax(0,1fr);gap:4px}
 .weeknumber{font-size:10px;border-radius:8px}
 .coursemark{width:8px;height:8px;flex-basis:8px}
 .weekday .coursemarks{gap:4px}
}
/* Päiväämättömien tehtävien tiivis avattava lista. */
.unscheduledgrid{gap:7px}
.unscheduled .pool-entry{min-width:0;overflow:hidden;background:var(--course-bg,#e9f0f8);border:1px solid var(--course-accent,#607a9c);border-left:5px solid var(--course-accent,#607a9c);border-radius:10px}
.unscheduled .pool-summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 12px;cursor:pointer}
.unscheduled .pool-summary::-webkit-details-marker{display:none}
.unscheduled .pool-summary:hover{background:#ffffff29}
.unscheduled .pool-summary:focus-visible{outline:2px solid #3974b9;outline-offset:-3px;border-radius:8px}
.unscheduled .pool-chevron{display:block;width:9px;height:9px;flex:none;border-right:2px solid #365473;border-bottom:2px solid #365473;transform:rotate(-45deg);transition:transform .15s ease}
.unscheduled .pool-entry[open] .pool-chevron{transform:rotate(45deg)}
.unscheduled .pool-summary-main{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;flex:1}
.unscheduled .pool-summary-title{font-size:13px;line-height:1.3;font-weight:800;color:#23364f;overflow-wrap:anywhere}
.unscheduled .pool-summary-course{max-width:100%;display:inline-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:1.4;font-weight:750;color:#36465e;background:#ffffffac;border-left:3px solid var(--course-accent,#607a9c);border-radius:4px;padding:2px 6px}
.unscheduled .pool-detail .item,
.unscheduled .pool-detail .item.task,
.unscheduled .pool-detail .item.task.done{background:transparent!important;border:0!important;border-top:1px solid #25364b21!important;border-radius:0!important;padding:9px 12px;margin:0}
.unscheduled .pool-detail .itemtitle,
.unscheduled .pool-detail .meta .course-pill{display:none}
.unscheduled .pool-detail .meta{margin-top:0}
@media(prefers-reduced-motion:reduce){.unscheduled .pool-chevron{transition:none}}
/* Tehtävälistat: vain tehtävän otsikko ja kurssi näkyvät, kun rivi on kiinni. */
.unscheduled .pool-detail .status-pill,
.unscheduled .pool-detail .itembody > .note{display:none}
.unscheduled .pool-calendar-hint{font-size:11px;color:#455e7c;font-weight:750;padding:9px 14px 0}
.unscheduled .pool-notes{border-top:1px solid #25364b21;padding:11px 13px 13px}
.unscheduled .pool-notes label{display:block;font-size:12px;font-weight:800;color:#344e6d;margin-bottom:6px}
.unscheduled .pool-notes textarea{display:block;box-sizing:border-box;width:100%;min-height:82px;padding:9px 11px;border:1px solid #b7c9de;border-radius:8px;resize:vertical;background:#fffdfd;color:#25344a;font:inherit;font-size:13px;line-height:1.45}
.unscheduled .pool-notes textarea:focus{outline:2px solid #5b91cf;outline-offset:1px}
.unscheduled .pool-note-status{font-size:11px;color:#5c7290;margin-top:6px}
.unscheduled .pool-notes a{display:inline-block;margin-top:7px;font-size:12px}
.completed-list{margin-top:12px}

/* Kolmisarakkeiset tehtäväpalkit: kurssi + opintopisteet, tehtävä, lisätiedot */

async function syncFromCloud(){
  try{
    const res=await fetch('./data.json?v='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!Array.isArray(data.records)||data.records.length>1000)throw new Error('Virheellinen tietomuoto');
    if(Array.isArray(data.courses)&&data.courses.length<=100)courseCatalog=data.courses.filter(c=>c&&typeof c.course==='string');
    const old=new Map(records.map(x=>[String(x.id),x]));
    const ids=new Set();
    const next=data.records.map((entry,i)=>{
      if(!entry||typeof entry.title!=='string'||!entry.id)throw new Error('Virheellinen merkintä');
      const x={...entry,id:String(entry.id),done:!!entry.done,custom:false};
      ids.add(x.id);
      const previous=old.get(x.id);
      if(previous&&previous._local===true&&previous._originDone===x.done){
        x.done=!!previous.done;
        x._local=true;
        x._originDone=previous._originDone;
      }
      if(previous&&previous._localDate===true){
        // Säilytä itse kalenteriin valittu päivä myös kun yhteiseen tietoon lisätään määräaika.
        x.date=previous.date||'';
        x._localDate=true;
        x._originDate=String(entry.date||'');
      }
      // Omia muistiinpanoja ei korvata GitHubin minuutin välein päivittyvillä tiedoilla.
      if(previous&&previous._localNote===true){
        x.note=String(previous.note||'');
        x._localNote=true;
      }
      return x;
    });
    const extras=records.filter(x=>x.custom&&!ids.has(x.id));
    records=[...next,...extras];
    cloudStatus='Ajantasaiset tiedot GitHubista';
    lastCloudSync=new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'});
    save();
    // Älä vie kohdistusta pois muistiinpanokentästä taustapäivityksen aikana.
    if(document.activeElement?.matches?.('.pool-note-input')){
      const indicator=host.querySelector('.syncState');
      if(indicator)indicator.textContent=cloudStatus+' · päivitetty klo '+lastCloudSync;
    }else render();
  }catch(err){
    cloudStatus='Yhteys ei onnistunut – näytetään selaimeen tallennetut tiedot';
    render();
  }
}
function dateObj(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}

function dayAdd(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function formatDate(d){return new Intl.DateTimeFormat('fi-FI',{day:'numeric',month:'numeric',year:'numeric'}).format(d)}
function isoWeekNumber(d){const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));const first=new Date(Date.UTC(u.getUTCFullYear(),0,1));return Math.ceil((((u-first)/86400000)+1)/7)}
function anchorBegin(){
 const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 return dayAdd(dayAdd(today,-((today.getDay()+6)%7)),offset*14);
}
function weekSlotForDate(begin,isoDate){
 for(let i=0;i<4;i++){
   if(isoDate>=dateStr(dayAdd(begin,i*7))&&isoDate<dateStr(dayAdd(begin,(i+1)*7)))return i;
 }
 return -1;
}
function activateWeekForDate(begin,isoDate){
 const slot=weekSlotForDate(begin,isoDate);
 if(slot>=0&&!weekVisibility[slot]){
   weekVisibility[slot]=true;
   saveWeekVisibility();
 }
 return slot;
}
function dateHead(d){return new Intl.DateTimeFormat('fi-FI',{weekday:'long',day:'numeric',month:'long'}).format(d)}

function sort(a,b){return (a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99')||a.title.localeCompare(b.title,'fi')}
// Yhteinen kurssivärikartta kaikille näkymille. Väri ei ilmaise tehtävän tilaa.
const COURSE_COLOR_MAP={
 'communication skills':['#dbe7ff','#375fae'],

function courseColorStyle(course){
 const key=String(course||'Oma merkintä').normalize('NFKC')
   .replace(/\s*·\s*\d+\s*op\s*$/i,'').trim().toLocaleLowerCase('fi-FI');
 let c=COURSE_COLOR_MAP[key];

   c=COURSE_FALLBACK[hash%COURSE_FALLBACK.length];

}

function expandCalendarEntries(begin,activeIndices){
 const expanded=records.filter(e=>e.date&&activeIndices.some(i=>
   e.date>=dateStr(dayAdd(begin,i*7))&&e.date<dateStr(dayAdd(begin,(i+1)*7))
 ));
 // Toistuvaa menoa ei tallenneta lukemattomille päiville: luo näkyviin vain valittujen viikkojen esiintymät.
 for(const base of records){
   const repeat=base.recurrence;
   if(!repeat||repeat.frequency!=='weekly'||!Number.isInteger(repeat.weekday)||repeat.weekday<0||repeat.weekday>6)continue;
   if(!/^\d{4}-\d{2}-\d{2}$/.test(repeat.start||''))continue;
   const mondayOffset=(repeat.weekday+6)%7; // JavaScript: sunnuntai 0, torstai 4.
   for(const i of activeIndices){
     const occurs=dateStr(dayAdd(begin,i*7+mondayOffset));
     if(occurs<repeat.start||(repeat.until&&occurs>repeat.until))continue;
     expanded.push({...base,id:base.id+'@'+occurs,date:occurs,recurringInstance:true});
   }
 }
 return expanded.sort(sort);
}

host.querySelector('#importFile').onchange=async(ev)=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;if(file.size>2000000){alert('Tiedosto on liian suuri (enintään 2 Mt).');return;}try{const input=JSON.parse(await file.text());const rr=Array.isArray(input)?input:input.records;if(!Array.isArray(rr)||rr.length>1000)throw new Error('Tiedoston muoto ei kelpaa.');const safe=rr.map((x,i)=>{if(!x||typeof x!=='object'||typeof x.title!=='string')throw new Error('Virheellinen tehtävä.');const kind=['task','lesson','activity','end'].includes(x.kind)?x.kind:'task';const date=typeof x.date==='string'&&(/^\d{4}-\d{2}-\d{2}$/.test(x.date)||x.date==='')?x.date:'';return {id:String(x.id||('import-'+i)).slice(0,100),date,title:x.title.slice(0,300),course:String(x.course||'Oma merkintä').slice(0,200),kind,time:String(x.time||'').slice(0,40),done:!!x.done,note:String(x.note||'').slice(0,2000),url:typeof x.url==='string'&&/^https:\/\//.test(x.url)?x.url:'',custom:!!x.custom,_localNote:!!x._localNote,recurrence:x.recurrence?.frequency==='weekly'&&Number.isInteger(x.recurrence.weekday)&&x.recurrence.weekday>=0&&x.recurrence.weekday<=6&&/^\d{4}-\d{2}-\d{2}$/.test(x.recurrence.start||'')?{frequency:'weekly',weekday:x.recurrence.weekday,start:x.recurrence.start,until:/^\d{4}-\d{2}-\d{2}$/.test(x.recurrence.until||'')?x.recurrence.until:''}:null}});if(records.length&&!confirm('Korvataanko nykyiset merkinnät tuoduilla tiedoilla?'))return;records=safe;if(Array.isArray(input.courses)&&input.courses.length<=100){courseCatalog=input.courses.filter(c=>c&&typeof c.course==='string')}save();offset=0;render();alert('Opintotiedot tuotu onnistuneesti ('+records.length+' merkintää).');}catch(ex){alert('Tuonti epäonnistui: '+ex.message)}};
host.querySelector('#exportBtn').onclick=()=>{const payload=JSON.stringify({format:'opintokeskus-2',records,courses:courseCatalog},null,2);const blob=new Blob([payload],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='opintokeskus-varmuuskopio.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1500)};
host.querySelectorAll('.unscheduled').forEach(section=>{
 section.addEventListener('toggle',e=>{
   if(e.target!==e.currentTarget)return;
   if(section.dataset.taskList==='done')completedOpen=section.open;
   else unscheduledOpen=section.open;
 });
});
host.querySelectorAll('[data-note-id]').forEach(input=>{
 input.addEventListener('input',()=>{
   const entry=records.find(x=>String(x.id)===input.dataset.noteId);
   if(!entry)return;
   entry.note=input.value.slice(0,2000);
   if(!entry.custom)entry._localNote=true;
   save();
   // Päivitä kolmannen sarakkeen ote ilman koko näkymän piirtämistä.
   const preview=input.closest('.pool-entry')?.querySelector('.pool-summary-note');
   if(preview){
     const text=entry.note.trim().replace(/\s+/g,' ');
     preview.textContent=text||'Lisää lisätietoja';
     preview.title=text;
     preview.classList.toggle('is-empty',!text);
   }
   const hint=input.closest('.pool-notes')?.querySelector('.pool-note-status');
   if(hint)hint.textContent='Tallennettu tähän selaimeen.';
 });
});
host.querySelectorAll('.pool-entry > summary').forEach(summary=>{
 summary.addEventListener('click',()=>{
   const entry=summary.parentElement;
   const id=entry.dataset.poolEntry;
   if(entry.open)expandedPoolTasks.delete(id);
   else expandedPoolTasks.add(id);
 });
});
host.querySelectorAll('[data-drag-id]').forEach(el=>{
 el.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',el.dataset.dragId);ev.dataTransfer.effectAllowed='move';el.classList.add('dragging')});
 el.addEventListener('dragend',()=>{el.classList.remove('dragging');host.querySelectorAll('.drop-ready').forEach(d=>d.classList.remove('drop-ready'))});
});
host.querySelectorAll('[data-pick-task]').forEach(el=>el.onclick=()=>{pickedTaskId=pickedTaskId===el.dataset.pickTask?'':el.dataset.pickTask;render()});
host.querySelectorAll('[data-day]').forEach(el=>{
 el.onclick=()=>{
  if(pickedTaskId){const taskId=pickedTaskId;pickedTaskId='';moveTask(taskId,el.dataset.day);return;}
  if(selectedDate===el.dataset.day){quickAddOpen=!quickAddOpen;}
  else{selectedDate=el.dataset.day;quickAddOpen=false;}
  render();if(quickAddOpen)host.querySelector('#dayNewTitle')?.focus();
 };
 el.addEventListener('dragover',ev=>{if(!ev.dataTransfer.types.includes('text/plain'))return;ev.preventDefault();ev.dataTransfer.dropEffect='move';el.classList.add('drop-ready')});
 el.addEventListener('dragleave',ev=>{if(!el.contains(ev.relatedTarget))el.classList.remove('drop-ready')});
 el.addEventListener('drop',ev=>{ev.preventDefault();el.classList.remove('drop-ready');const id=ev.dataTransfer.getData('text/plain');if(id)moveTask(id,el.dataset.day)});
});
const dayAddBtn=host.querySelector('#dayAddBtn');
if(dayAddBtn)dayAddBtn.onclick=()=>{quickAddOpen=!quickAddOpen;render();if(quickAddOpen)host.querySelector('#dayNewTitle')?.focus()};
const cancelDay=host.querySelector('#dayQuickCancel');
if(cancelDay)cancelDay.onclick=()=>{quickAddOpen=false;render()};
const quickFormEl=host.querySelector('#dayQuickForm');
if(quickFormEl)quickFormEl.onsubmit=ev=>{
 ev.preventDefault();
 const fd=new FormData(quickFormEl),title=String(fd.get('title')||'').trim().slice(0,300);
 if(!title)return;
 records.push({id:'mine-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),date:selectedDate,title,course:String(fd.get('course')||'').trim().slice(0,200)||'Oma merkintä',kind:fd.get('kind')==='lesson'?'lesson':'task',time:String(fd.get('time')||'').trim().slice(0,40),done:false,note:String(fd.get('note')||'').trim().slice(0,1000),url:'',custom:true});
 quickAddOpen=false;save();render();
};
host.querySelectorAll('[data-week-visible]').forEach(input=>input.onchange=()=>{
 const index=Number(input.dataset.weekVisible);
 if(!Number.isInteger(index)||index<0||index>3)return;
 if(!input.checked&&weekVisibility.filter(Boolean).length===1){input.checked=true;return;}
 weekVisibility[index]=input.checked;
 saveWeekVisibility();
 quickAddOpen=false;
 render();
});
host.querySelector('#resetWeeks').onclick=()=>{
 weekVisibility=[true,true,false,false];
 saveWeekVisibility();
 quickAddOpen=false;
 render();
};
const periodButton=host.querySelector('#rangeSelect');
const periodInput=host.querySelector('#rangePicker');
periodButton.onclick=()=>{periodInput.value=selectedDate||dateStr(new Date());if(typeof periodInput.showPicker==='function')periodInput.showPicker();else periodInput.click()};
periodButton.onkeydown=ev=>{if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();offset+=ev.key==='ArrowLeft'?-1:1;quickAddOpen=false;render();host.querySelector('#rangeSelect')?.focus()}};
periodInput.onchange=()=>{const target=periodInput.value;if(!target||dateStr(dateObj(target))!==target)return;const firstMonday=dayAdd(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()),-((new Date().getDay()+6)%7));const chosen=dateObj(target);const days=Math.round((Date.UTC(chosen.getFullYear(),chosen.getMonth(),chosen.getDate())-Date.UTC(firstMonday.getFullYear(),firstMonday.getMonth(),firstMonday.getDate()))/86400000);offset=Math.floor(days/14);activateWeekForDate(anchorBegin(),target);selectedDate=target;quickAddOpen=false;render()};
host.querySelector('#addBtn').onclick=()=>{formOpen=!formOpen;if(formOpen){activeTab='calendar';try{localStorage.setItem(TAB_STORE_KEY,activeTab)}catch(e){}}render()};host.querySelectorAll('[data-check]').forEach(x=>x.onclick=()=>{let e=records.find(t=>t.id===x.dataset.check);if(e){const oldDone=!!e.done;e.done=!e.done;if(!e.custom){if(e._local){if(e.done===e._originDone){delete e._local;delete e._originDone;}}else{e._local=true;e._originDone=oldDone;}}save();render()}});host.querySelectorAll('[data-unschedule]').forEach(x=>x.onclick=()=>moveTask(x.dataset.unschedule,''));
host.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{if(!confirm('Poistetaanko tapahtumamerkintä kokonaan?'))return;records=records.filter(t=>t.id!==x.dataset.delete);save();render()});host.querySelector('#newForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),title=String(fd.get('title')||'').trim();if(!title)return;records.push({id:'mine-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),date:String(fd.get('date')||''),title,course:String(fd.get('course')||'Oma merkintä'),kind:String(fd.get('kind')||'task'),time:'',done:false,note:'',url:'',custom:true});formOpen=false;save();render()};
}
// Sivun tyhjää aluetta tai muuta sisältöä klikkaamalla kalenteripäivän valinta poistuu.
document.addEventListener('click',event=>{
 if(!selectedDate||!(event.target instanceof Element))return;
 if(event.target.closest('[data-day],.daydetails'))return;
 selectedDate='';
 quickAddOpen=false;
 // Poista korostus ilman koko sivun uudelleenpiirtoa, jotta muut toiminnot
 // (esim. tiedoston valinta tai lomakkeen avaus) eivät keskeydy.
 const selected=host.querySelector('.weekday.selected');
 if(selected){
   selected.classList.remove('selected');
   selected.setAttribute('aria-pressed','false');
   selected.querySelector('.dayplus')?.remove();
 }
 host.querySelector('.daydetails')?.remove();
});
render();syncFromCloud();setInterval(syncFromCloud,60000);
})();
</script></body></html>
